name: Build desktop apps

# Builds the no-Terminal Vigil app for macOS and Windows on native runners,
# code-signs + notarizes them WHEN the signing secrets are configured (and
# quietly falls back to unsigned when they aren't), then attaches the installers
# to the GitHub Release.
#
# To enable signing, add these repo secrets (Settings > Secrets and variables >
# Actions). Until they exist, builds stay unsigned and everything still works.
#
#   macOS (Developer ID + notarization):
#     MACOS_CERTIFICATE        base64 of your "Developer ID Application" .p12
#     MACOS_CERTIFICATE_PWD    password for that .p12
#     MACOS_SIGNING_IDENTITY   e.g. "Developer ID Application: Name (TEAMID)"
#     MACOS_NOTARY_APPLE_ID    your Apple ID email
#     MACOS_NOTARY_PASSWORD    an app-specific password for that Apple ID
#     MACOS_NOTARY_TEAM_ID     your 10-char Apple Team ID
#
#   Windows (Authenticode):
#     WINDOWS_CERTIFICATE      base64 of your code-signing .pfx
#     WINDOWS_CERTIFICATE_PWD  password for that .pfx
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: Vigil.dmg
          - os: windows-latest
            asset: Vigil.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-desktop.txt
          pip install pyinstaller

      - name: Build app
        run: pyinstaller vigil.spec --noconfirm

      # ---------------------------------------------------------------- macOS
      - name: Sign app (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -e
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "No MACOS_CERTIFICATE secret — ad-hoc signing (unsigned build)."
            codesign --force --deep --sign - "dist/Vigil.app" || true
            exit 0
          fi
          echo "Importing Developer ID certificate…"
          KEYCHAIN="$RUNNER_TEMP/vigil.keychain-db"
          KP="$(openssl rand -base64 24)"
          security create-keychain -p "$KP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KP" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PWD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "Signing (hardened runtime + entitlements)…"
          codesign --force --deep --options runtime --timestamp \
            --entitlements entitlements.plist \
            --sign "$MACOS_SIGNING_IDENTITY" "dist/Vigil.app"
          codesign --verify --deep --strict --verbose=2 "dist/Vigil.app"

      - name: Package macOS (.dmg)
        if: runner.os == 'macOS'
        run: |
          set -e
          python -m pip install --quiet pillow || true
          python make_dmg_background.py || true
          brew install create-dmg
          rm -f Vigil.dmg
          ok=0
          # Judge success by the OUTPUT, not create-dmg's exit code (it can
          # return non-zero on newer macOS even after producing a good .dmg).
          for attempt in 1 2 3; do
            create-dmg \
              --volname "Vigil" \
              --background "build/dmg-bg.png" \
              --window-pos 200 120 \
              --window-size 640 420 \
              --icon-size 128 \
              --icon "Vigil.app" 170 200 \
              --app-drop-link 470 200 \
              --hide-extension "Vigil.app" \
              --no-internet-enable \
              "Vigil.dmg" "dist/Vigil.app" || true
            if [ -f Vigil.dmg ] && [ "$(stat -f%z Vigil.dmg)" -gt 50000000 ]; then ok=1; break; fi
            echo "create-dmg attempt $attempt didn't produce a valid dmg; retrying…"
            sleep 5; rm -f Vigil.dmg
          done
          if [ "$ok" != "1" ]; then
            echo "create-dmg failed — building a plain drag-install dmg instead"
            rm -rf dmgroot && mkdir dmgroot
            cp -R "dist/Vigil.app" dmgroot/
            ln -s /Applications dmgroot/Applications
            hdiutil create -volname "Vigil" -srcfolder dmgroot -ov -format UDZO "Vigil.dmg"
          fi
          echo "DMG: $(du -h Vigil.dmg | cut -f1)"

      - name: Notarize (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          set -e
          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$MACOS_NOTARY_APPLE_ID" ]; then
            echo "Signing/notary secrets not set — skipping notarization."
            exit 0
          fi
          echo "Signing the .dmg…"
          codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "Vigil.dmg"
          echo "Submitting to Apple notary (this can take a few minutes)…"
          xcrun notarytool submit "Vigil.dmg" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --password "$MACOS_NOTARY_PASSWORD" \
            --team-id "$MACOS_NOTARY_TEAM_ID" --wait
          echo "Stapling the ticket…"
          xcrun stapler staple "Vigil.dmg"
          xcrun stapler validate "Vigil.dmg"

      # -------------------------------------------------------------- Windows
      - name: Sign app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PWD: ${{ secrets.WINDOWS_CERTIFICATE_PWD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host "No WINDOWS_CERTIFICATE secret — leaving the app unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "vigil.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
                       Sort-Object FullName | Select-Object -Last 1).FullName
          Write-Host "Signing Vigil.exe with $signtool"
          & $signtool sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PWD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 "dist\Vigil\Vigil.exe"
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Remove-Item $pfx

      - name: Package Windows (.zip)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist\Vigil\* -DestinationPath Vigil.zip -Force

      # -------------------------------------------------------------- Publish
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
