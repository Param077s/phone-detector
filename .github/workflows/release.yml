name: Build desktop apps

# Builds the no-Terminal Vigil app for macOS and Windows on native runners
# (this is how we build Windows without a Windows machine), then attaches the
# installers to the GitHub Release.
#
# Trigger:
#   • push a tag like  v1.0.0   -> builds + attaches to that release
#   • or run manually from the Actions tab (workflow_dispatch) to just test
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write            # needed to upload assets to the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: Vigil.dmg
          - os: windows-latest
            asset: Vigil.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-desktop.txt
          pip install pyinstaller

      - name: Build app
        run: pyinstaller vigil.spec --noconfirm

      # ---- macOS: ad-hoc sign (avoids the "app is damaged" block on Apple
      #      Silicon for unsigned downloads) then wrap in a .dmg ----
      - name: Package macOS (.dmg)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - "dist/Vigil.app" || true
          hdiutil create -volname "Vigil" -srcfolder "dist/Vigil.app" \
            -ov -format UDZO "Vigil.dmg"

      # ---- Windows: zip the app folder ----
      - name: Package Windows (.zip)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist\Vigil\* -DestinationPath Vigil.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
