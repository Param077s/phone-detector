<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vigil · Exam</title>
  <link rel="icon" href="/favicon.svg">
  <meta name="theme-color" content="#f3f2ef">
  <link rel="stylesheet" href="/exam/style.css">
  <style>
    .card{width:100%;max-width:440px;padding:26px 24px;animation:rise .5s var(--spring) both}
    @keyframes rise{from{opacity:0;transform:translateY(12px) scale(.99)}}
    .top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
    h1{font-size:20px;margin:0 0 4px} .lead{color:var(--muted);font-size:13.5px;margin-bottom:6px}
    .status-lg{display:flex;align-items:center;gap:12px;margin:2px 0 10px}
    .status-lg .dot{width:13px;height:13px;box-shadow:0 0 0 5px var(--ok-soft)}
    .status-lg .dot.warn{box-shadow:0 0 0 5px var(--warn-soft)} .status-lg .dot.alert{box-shadow:0 0 0 5px var(--alert-soft)}
    .status-lg .t{font-size:16px;font-weight:600} .status-lg .s{font-size:13px;color:var(--muted)}
    .preview{position:relative;border-radius:var(--r-sm);overflow:hidden;background:#0e1116;aspect-ratio:4/3;margin:12px 0;border:1px solid var(--line-strong)}
    .preview video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
    .preview .tag{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.92);color:var(--ink);font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:8px}
    .bar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:14px}
    .bar > i{display:block;height:100%;width:0;background:var(--ink);border-radius:6px;transition:width .1s linear}
    .rows{border-top:1px solid var(--line);margin-top:6px}
    .row{display:flex;justify-content:space-between;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14px}
    .row .k{color:var(--muted)} .row .v{font-weight:600}
    .v.ok{color:var(--ok)} .v.warn{color:var(--warn)} .v.alert{color:var(--alert)}
    .debug{margin-top:12px;font:11.5px/1.6 ui-monospace,Menlo,monospace;color:var(--faint);white-space:pre}
    .leave{display:block;text-align:center;color:var(--muted);font-size:13px;margin-top:16px;font-weight:600}
  </style>
</head>
<body>
  <div class="center">
    <div class="card">
      <div class="top brand"><span class="mk"><svg viewBox="0 0 24 24" fill="none"><path d="M6 10V7.5A1.5 1.5 0 0 1 7.5 6H10M14 6h2.5A1.5 1.5 0 0 1 18 7.5V10M18 14v2.5a1.5 1.5 0 0 1-1.5 1.5H14M10 18H7.5A1.5 1.5 0 0 1 6 16.5V14" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="2.6" fill="#fff"/></svg></span><b>Vigil</b><span class="tag">· Exam</span></div>

      <!-- calibrate -->
      <section id="s-calib">
        <h1>Getting ready</h1>
        <p class="lead" id="calibMsg">Look at your screen normally and hold still for a few seconds.</p>
        <div class="preview"><video id="calibVid" playsinline muted></video><span class="tag">🔒 On this device only</span></div>
        <div class="bar"><i id="calibBar"></i></div>
      </section>

      <!-- monitor -->
      <section id="s-monitor" class="hidden">
        <div class="status-lg"><span class="dot ok" id="mDot"></span><div><div class="t" id="mTitle">Exam</div><div class="s" id="mSub">Monitored · you may begin</div></div></div>
        <div class="preview"><video id="monVid" playsinline muted></video><span class="tag" id="monTag">🟢 Camera active · nothing is uploaded</span></div>
        <div class="rows">
          <div class="row"><span class="k">You</span><span class="v" id="yourName">—</span></div>
          <div class="row"><span class="k">Monitor</span><span class="v ok" id="rState">Looking at screen</span></div>
        </div>
        <div class="debug hidden" id="debug"></div>
        <div style="display:flex;gap:18px;justify-content:center;margin-top:16px">
          <a class="leave" id="activityLink" style="margin:0">Your activity</a>
          <a class="leave" href="/exam/" style="margin:0">Leave exam</a>
        </div>
      </section>

      <!-- error -->
      <section id="s-error" class="hidden">
        <h1>Something went wrong</h1>
        <p class="lead" id="errMsg">Could not start monitoring.</p>
        <a class="btn primary block" href="/exam/" style="margin-top:14px">Back</a>
      </section>
    </div>
  </div>
  <script type="module" src="/exam/room.js"></script>
</body>
</html>
