<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vigil · Exam</title>
  <link rel="icon" href="/favicon.svg">
  <meta name="theme-color" content="#f3f2ef">
  <link rel="stylesheet" href="/exam/style.css">
  <style>
    .card{width:100%;max-width:440px;padding:26px 24px;animation:rise .5s var(--spring) both}
    @keyframes rise{from{opacity:0;transform:translateY(12px) scale(.99)}}
    .top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
    h1{font-size:20px;margin:0 0 4px} .lead{color:var(--muted);font-size:13.5px;margin-bottom:14px}
    .status-lg{display:flex;align-items:center;gap:12px;margin:4px 0 12px}
    .status-lg .dot{width:13px;height:13px;box-shadow:0 0 0 5px var(--ok-soft)}
    .status-lg .t{font-size:16px;font-weight:600} .status-lg .s{font-size:13px;color:var(--muted)}
    .preview{position:relative;border-radius:var(--r-sm);overflow:hidden;background:#0e1116;aspect-ratio:4/3;margin:12px 0;border:1px solid var(--line-strong)}
    .preview video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
    .preview .tag{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.92);color:var(--ink);font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:8px}
    .rows{border-top:1px solid var(--line);margin-top:6px}
    .row{display:flex;justify-content:space-between;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14px}
    .row .k{color:var(--muted)} .row .v{font-weight:600}
    .leave{display:block;text-align:center;color:var(--muted);font-size:13px;margin-top:16px;font-weight:600}
  </style>
</head>
<body>
  <div class="center">
    <div class="card">
      <div class="top brand"><span class="mk"><svg viewBox="0 0 24 24" fill="none"><path d="M6 10V7.5A1.5 1.5 0 0 1 7.5 6H10M14 6h2.5A1.5 1.5 0 0 1 18 7.5V10M18 14v2.5a1.5 1.5 0 0 1-1.5 1.5H14M10 18H7.5A1.5 1.5 0 0 1 6 16.5V14" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="2.6" fill="#fff"/></svg></span><b>Vigil</b><span class="tag" id="examName">· Exam</span></div>

      <div class="status-lg"><span class="dot ok" id="mDot"></span><div><div class="t" id="mTitle">You're in</div><div class="s" id="mSub">Monitored · you may begin</div></div></div>
      <div class="preview"><video id="vid" playsinline muted autoplay></video><span class="tag" id="camTag">🔒 On this device only · nothing is uploaded</span></div>
      <div class="rows">
        <div class="row"><span class="k">Your name</span><span class="v" id="yourName">—</span></div>
        <div class="row"><span class="k">Connection</span><span class="v" id="conn" style="color:var(--ok)">Connected</span></div>
      </div>
      <a class="leave" href="/exam/">Leave exam</a>
    </div>
  </div>

  <script type="module">
    import { sb, esc } from "/exam/sb.js";
    const $ = id => document.getElementById(id);
    const examId = new URLSearchParams(location.search).get("e");

    (async () => {
      const { data:{ user } } = await sb.auth.getUser();
      if (!user || !examId) { location.replace("/exam/"); return; }

      const { data:exam } = await sb.from("exams").select("title,status").eq("id", examId).maybeSingle();
      if (!exam) { location.replace("/exam/"); return; }
      $("examName").textContent = "· " + exam.title;

      const { data:part } = await sb.from("participants").select("id,name").eq("exam_id",examId).eq("user_id",user.id).maybeSingle();
      if (!part) { location.replace("/exam/"); return; }
      $("yourName").textContent = part.name;
      const pid = part.id;

      // local camera preview — stays on this device (no upload; pattern detection is the next slice)
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
        $("vid").srcObject = stream;
      } catch (e) {
        $("camTag").textContent = "Camera off — your invigilator is notified";
        $("mDot").className = "dot warn"; $("mSub").textContent = "Camera not available";
        await sb.from("participants").update({ status: "alert" }).eq("id", pid).eq("user_id", user.id);
      }

      // heartbeat: keep the teacher's live room showing us present
      async function beat(status){
        await sb.from("participants").update({ last_seen: new Date().toISOString(), status: status || "ok" }).eq("id", pid).eq("user_id", user.id);
      }
      beat("ok");
      setInterval(() => beat(), 8000);
      window.addEventListener("beforeunload", () => { navigator.sendBeacon && sb.from("participants").update({ status:"offline" }).eq("id",pid); });
    })();
  </script>
</body>
</html>
