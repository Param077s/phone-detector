<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vigil · Live exam</title>
  <link rel="icon" href="/favicon.svg">
  <meta name="theme-color" content="#f3f2ef">
  <link rel="stylesheet" href="/exam/style.css">
  <style>
    /* ── the room ─────────────────────────────────────────────────────────
       Most of an exam is quiet, and the screen should look it. A quiet tile
       is a faint name and nothing else; colour appears only where a teacher
       would actually want to look. */
    .bar{display:flex;align-items:center;gap:14px;padding-top:15px;padding-bottom:15px}
    .bar>.inner{display:flex;align-items:center;gap:14px}
    .bar .sp{flex:1}
    .bar .code{color:var(--faint);font:600 12px ui-monospace,Menlo,monospace;letter-spacing:2px}
    .backlink{color:var(--muted);display:inline-flex;align-items:center}
    .backlink svg{width:17px;height:17px}
    .backlink:hover{color:var(--ink)}
    .quiet-btn{background:none;border:0;padding:0;font:500 13px var(--font);color:var(--faint);cursor:pointer;transition:color .18s}
    .quiet-btn:hover{color:var(--ink)}

    .wrap{padding-bottom:60px}
    .eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
    .head{display:flex;align-items:baseline;gap:12px;margin:0 0 20px;flex-wrap:wrap}
    .head h1{font-size:24px;font-weight:500;letter-spacing:-.02em;margin:0}
    .head .count{font-size:14px;color:var(--muted)}

    .room{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
    /* who joined — one row per student, opened in place */
    .sortbar{display:flex;align-items:center;gap:6px;margin:0 0 12px}
    .sortbar .sl{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
      color:var(--faint);margin-right:4px}
    .sortbar button{border:1px solid var(--line);background:var(--card);border-radius:999px;
      padding:5px 12px;font:600 12.5px var(--font);color:var(--muted);cursor:pointer;
      transition:border-color .18s,color .18s}
    .sortbar button:hover{border-color:var(--ink);color:var(--ink)}
    .sortbar button.on{background:var(--ink);border-color:var(--ink);color:#fff}
    .stime{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
    .sdot.off{background:var(--faint)}
    .scard.gone{opacity:.62}
    @keyframes fadein{from{opacity:0}}

    .roomline{display:flex;align-items:baseline;gap:10px;margin-top:26px;font-size:13.5px;color:var(--muted)}
    .roomline .see{background:none;border:0;padding:0;font:600 13.5px var(--font);color:var(--ink);cursor:pointer;
      border-bottom:1px solid var(--line-strong)}
    .roomline .see:hover{border-color:var(--ink)}
    .empty{color:var(--muted);padding:60px 4px} .empty b{display:block;font-size:17px;color:var(--ink);font-weight:500;margin-bottom:5px}

    /* ── the tile becomes the popup ────────────────────────────────────── */
    .scrim{position:fixed;inset:0;z-index:100;background:rgba(243,242,239,.72);opacity:0;
      transition:opacity .28s ease;pointer-events:none;display:none}
    .scrim.on{opacity:1;pointer-events:auto}
    .popWrap{position:fixed;inset:0;z-index:101;display:none;place-items:center;padding:22px;pointer-events:none}
    .popWrap.on{display:grid}
    .pop{width:min(400px,100%);background:var(--card);border-radius:16px;padding:22px 22px 16px;
      box-shadow:var(--shadow);transform-origin:0 0;pointer-events:auto;will-change:transform}
    .popIn{transition:opacity .2s ease}
    .pop .ptop{display:flex;align-items:center;gap:10px}
    .pop .ptop .dot{width:9px;height:9px;border-radius:50%;corner-shape:round;background:var(--faint)}
    .pop h2{font-size:21px;font-weight:500;letter-spacing:-.02em;margin:0}
    .pop .pstat{font-size:13.5px;color:var(--muted);margin:5px 0 0}
    .pop .lab{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:22px 0 8px}
    .pop .row{display:flex;gap:12px;font-size:13.5px;padding:4px 0}
    .pop .row .t{color:var(--faint);min-width:44px;font-variant-numeric:tabular-nums}
    .pop .row .w{color:var(--ink-2)}
    .pop .row.alert .w{color:#a32d2d}
    .pop .who{font-size:13.5px;color:var(--ink-2);line-height:1.6;margin:0}
    .pop .caveat{font-size:12.5px;color:var(--warn);margin-top:14px}
    .pop .noteRow{margin-top:20px;border-top:1px solid var(--line);padding-top:12px}
    .pop .noteRow input{width:100%;border:0;outline:none;background:none;font:14px var(--font);color:var(--ink);padding:2px 0}
    .pop .noteRow input::placeholder{color:var(--faint)}
    .pop .noted{font-size:12.5px;color:var(--muted);margin-top:6px}
    @media(max-width:860px){ .room{grid-template-columns:repeat(3,minmax(0,1fr))} }
    @media(max-width:560px){ .room{grid-template-columns:repeat(2,minmax(0,1fr))} }
    @media(prefers-reduced-motion:reduce){ .pop,.popIn,.scard,.wbar{transition-duration:.01ms !important} }
  </style>
</head>
<body>
  <div class="bar glassbar fluid">
    <div class="inner">
    <a class="backlink" href="/exam/console.html" aria-label="Back to console"><svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <span class="code" id="code"></span>
    <span class="sp"></span>
    <button class="btn ink sm hidden" id="startBtn" type="button">Start exam</button>
    <button class="quiet-btn hidden" id="roomNote" type="button">Note the room</button>
    </div>
  </div>

  <div class="wrap fluid">
    <div class="eyebrow" id="eyebrow">Live</div>
    <div class="head"><h1 id="h1">Your room</h1><span class="count" id="count"></span></div>
    <div class="sortbar" id="sortbar" style="display:none">
      <span class="sl">Order</span>
      <button type="button" data-sort="joined" class="on">Joined</button>
      <button type="button" data-sort="name">Name</button>
      <button type="button" data-sort="flags">Flags</button>
    </div>
    <div id="out"><div class="empty"><b>Waiting for students…</b>Share the code — names appear here the moment they join.</div></div>
    <div class="roomline hidden" id="setupline"><span id="setuptxt"></span><button class="see" id="setupsee" type="button">Who</button></div>
    <div class="roomline hidden" id="roomline"><span id="roomtxt"></span><button class="see" id="roomsee" type="button">See it</button></div>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="popWrap" id="popWrap" aria-hidden="true">
    <div class="pop" id="pop" role="dialog" aria-modal="true" aria-labelledby="popName"><div class="popIn" id="popIn"></div></div>
  </div>

  <script type="module">
    import { sb, fetchExam, selectAll, orderedEvents, EXAM_COLS } from "/exam/sb.js";
    import { esc, label, clock, ago, readExam, roomHeadline, ALERT_KINDS, t, isOnline,
             examOver, examStarted, examPending, msLeft, countdown, useTimezone,
             whenChart, kindChips, reportBand, examWindow } from "/exam/exam-core.js";
    // The room is the page most likely to be left and returned to — a teacher
    // walks between it, the report and the console all lesson. Everything it
    // starts (two clocks, a realtime subscription, a visibility listener) is
    // registered for teardown, because none of it should still be running
    // against a room nobody is looking at.
    import { go, replace, every, listen, channel, cached, invalidate } from "/exam/nav.js";
    import { send } from "/exam/outbox.js";
    const $ = id => document.getElementById(id);
    const examId = new URLSearchParams(location.search).get("e");

    const parts = new Map();            // participant id -> row
    const events = [];                  // every flag in this exam, oldest first
    const seenEv = new Set();           // ids already held, so realtime can't double-count
    let CLOSED = false, exam = null, read = null, notesOn = false;
    const tiles = new Map();            // participant id -> tile element (kept, never rebuilt)

    const fresh = row => CLOSED || isOnline(row);

    function addEvent(e) {
      if (e.id && seenEv.has(e.id)) return false;
      if (e.id) seenEv.add(e.id);
      events.push(e);
      events.sort((a, b) => t(a.at) - t(b.at));
      return true;
    }

    // ── keeping the room true ───────────────────────────────────────────────
    // Realtime is the fast path, not the only path. Sockets drop, tabs sleep, and
    // a teacher must never have to leave and come back to find out who joined —
    // so we also just ask, every few seconds. The roster is tiny; events are
    // fetched incrementally from the newest one we already hold.
    let lastEventAt = null, polling = false;
    async function refresh() {
      if (polling) return; polling = true;
      try {
        // Both reads PAGE. The first pass here asks for the whole event log, and
        // PostgREST caps a select at its max-rows setting — so a big room would
        // silently start mid-exam, and the tiles would be calm about students
        // whose flags were simply never delivered. This is the one surface where
        // being quietly out of date is worst: it is watched while it matters.
        const pq = selectAll(() => sb.from("participants").select("*")
          .eq("exam_id", examId).order("id", { ascending: true }));
        const eq = selectAll(() => orderedEvents(
          lastEventAt
            ? sb.from("events").select("id,participant_id,kind,severity,at,meta,review")
                .eq("exam_id", examId).gt("at", lastEventAt)
            : sb.from("events").select("id,participant_id,kind,severity,at,meta,review")
                .eq("exam_id", examId)));
        const [pr, er] = await Promise.all([pq, eq]);
        if (pr.data) {
          const seen = new Set(pr.data.map(r => r.id));
          pr.data.forEach(r => parts.set(r.id, r));
          for (const id of [...parts.keys()]) if (!seen.has(id)) parts.delete(id);
        }
        (er.data || []).forEach(e => { addEvent(e); if (!lastEventAt || e.at > lastEventAt) lastEventAt = e.at; });
        render();
      } catch (_) { /* a blip must never blank the room */ }
      finally { polling = false; }
    }

    // ── the room ────────────────────────────────────────────────────────────
    // ── who joined ───────────────────────────────────────────────────────────
    // A grid of tiles answered "is the room here" and nothing else — to find out
    // when somebody arrived, or what they had been doing, you had to open a
    // popup and read a list. It is a list of people now, in an order you choose,
    // and pressing one opens the same card the report shows: when they joined,
    // when they were last seen, when their flags fell, and what they were.
    //
    // Rows are reconciled rather than rebuilt. This repaints every couple of
    // seconds while an exam runs, and replacing the list each time would close
    // whatever the invigilator had just opened.
    let sortBy = localStorage.getItem("vg_sort") || "joined";
    const rows = new Map();             // participant id -> row element
    let openId = null;                  // the one card left open, kept across repaints

    function sortRows(list) {
      const by = {
        joined: (a, b) => t(a.p.joined_at) - t(b.p.joined_at),
        name:   (a, b) => a.p.name.localeCompare(b.p.name),
        flags:  (a, b) => b.events.length - a.events.length || b.score - a.score,
      }[sortBy] || (() => 0);
      return list.slice().sort((a, b) => by(a, b) || a.p.name.localeCompare(b.p.name));
    }

    function rowHtml(s) {
      const band = reportBand(s);
      const cls = CLOSED ? (band === "high" ? "high" : band === "medium" ? "medium" : "") : "";
      return '<button class="shead"><span class="sdot ' + cls + '"></span>' +
        '<span class="sname"></span><span class="stime"></span>' +
        '<span class="schev">\u203a</span></button>' +
        '<div class="sbody"><div class="sinner"><div class="spad"></div></div></div>';
    }
    // the body is built only when a row is actually opened — a hundred students
    // is a hundred charts nobody has asked to see
    function fillBody(el, s) {
      const pad = el.querySelector(".spad");
      if (pad.dataset.built === String(s.events.length)) return;
      pad.dataset.built = String(s.events.length);
      pad.innerHTML =
        '<div class="slab">When it happened<span class="rt">' +
          (s.events.length ? s.events.length + " flag" + (s.events.length === 1 ? "" : "s") : "") +
        '</span></div>' + whenChart(s, { end: examWindow(exam).endT }) +
        (s.events.length ? '<div class="slab">What was flagged</div>' + kindChips(s) : "") +
        // the note an invigilator sends a student lives in the popup; the tile
        // that used to open it is gone, so the card carries the door instead
        '<button class="srec" data-note="' + esc(s.p.id) + '">Note this student \u203a</button>';
    }
    function runWhen(el) {
      el.querySelectorAll(".wcol").forEach((c, i) => setTimeout(() => {
        const bar = c.querySelector(".wbar");
        if (bar) bar.style.height = bar.dataset.h + "%";
        c.classList.add("on");
      }, 280 + i * 55));
    }
    function resetWhen(el) {
      el.querySelectorAll(".wcol").forEach(c => {
        const bar = c.querySelector(".wbar");
        if (bar) bar.style.height = "0%";
        c.classList.remove("on");
      });
    }

    function render() {
      read = readExam([...parts.values()], events);
      const list = read.students;
      if (!list.length) {
        $("out").innerHTML = CLOSED
          ? '<div class="empty"><b>No one joined this exam.</b></div>'
          : '<div class="empty"><b>Waiting for students…</b>Share the code — names appear here the moment they join.</div>';
        rows.clear(); $("sortbar").style.display = "none"; $("count").textContent = ""; return;
      }
      $("sortbar").style.display = "";
      let host = $("out").querySelector(".rowlist");
      if (!host) { $("out").innerHTML = '<div class="rowlist"></div>';
        host = $("out").querySelector(".rowlist"); rows.clear(); }

      let on = 0, off_ = 0, look = 0;
      const ordered = sortRows(list);
      for (const s of ordered) {
        const off = !fresh(s.p);
        const flagged = s.serious && !CLOSED;
        if (off) off_++; else on++;
        if (flagged) look++;
        let el = rows.get(s.p.id);
        if (!el) {
          el = document.createElement("div");
          el.className = "scard"; el.setAttribute("data-id", s.p.id);
          el.innerHTML = rowHtml(s);
          host.appendChild(el); rows.set(s.p.id, el);
        }
        el.classList.toggle("high", flagged || (CLOSED && reportBand(s) === "high"));
        el.classList.toggle("medium", CLOSED && reportBand(s) === "medium" && !flagged);
        el.classList.toggle("gone", off && !CLOSED);
        const dot = el.querySelector(".sdot");
        dot.className = "sdot" + (flagged ? " high" : CLOSED
          ? (reportBand(s) === "high" ? " high" : reportBand(s) === "medium" ? " medium" : "")
          : (off ? " off" : ""));
        const nm = el.querySelector(".sname");
        if (nm.textContent !== s.p.name) nm.textContent = s.p.name;
        // what a row says depends on why you are reading it: during the exam,
        // who is here; afterwards, when they came and when they went.
        const when = CLOSED
          ? clock(t(s.p.joined_at)) + (s.p.last_seen ? " – " + clock(t(s.p.last_seen)) : "")
          : (off ? "offline · joined " + clock(t(s.p.joined_at))
                 : "online · joined " + clock(t(s.p.joined_at)));
        const tm = el.querySelector(".stime");
        if (tm.textContent !== when) tm.textContent = when;
        el.querySelector(".shead").setAttribute("aria-expanded", String(openId === s.p.id));
        if (openId === s.p.id) { fillBody(el, s); el.classList.add("open"); }
      }
      for (const [id, el] of rows) if (!parts.has(id)) { el.remove(); rows.delete(id); }
      // move only what is out of place — reordering every row on every repaint
      // is what used to make the room flicker
      let want = host.firstChild;
      for (const s of ordered) {
        const el = rows.get(s.p.id); if (!el) continue;
        if (el !== want) host.insertBefore(el, want); else want = el.nextSibling;
      }

      renderSetupLine();
      $("count").textContent = CLOSED
        ? list.length + (list.length === 1 ? " student" : " students")
        : on + " online" + (off_ ? " · " + off_ + " offline" : "") + (look ? " · " + look + " worth a look" : "");
      renderRoomLine();
    }

    $("sortbar").querySelectorAll("button").forEach(x =>
      x.classList.toggle("on", x.getAttribute("data-sort") === sortBy));
    $("sortbar").addEventListener("click", e => {
      const b = e.target.closest("[data-sort]"); if (!b) return;
      sortBy = b.getAttribute("data-sort");
      localStorage.setItem("vg_sort", sortBy);
      $("sortbar").querySelectorAll("button").forEach(x =>
        x.classList.toggle("on", x.getAttribute("data-sort") === sortBy));
      render();
    });
    $("out").addEventListener("click", e => {
      if (e.target.closest("[data-note]")) return;   // that opens the note, not the row
      const head = e.target.closest(".shead"); if (!head) return;
      const el = head.closest(".scard"), id = el.getAttribute("data-id");
      const was = el.classList.contains("open");
      // one at a time — a hundred open records is the wall of data this replaced
      rows.forEach(r => { r.classList.remove("open"); resetWhen(r);
        r.querySelector(".shead").setAttribute("aria-expanded", "false"); });
      openId = was ? null : id;
      if (!was) {
        const s = read.students.find(x => x.p.id === id);
        if (s) fillBody(el, s);
        el.classList.add("open"); head.setAttribute("aria-expanded", "true"); runWhen(el);
        setTimeout(() => el.scrollIntoView({ behavior: "smooth", block: "nearest" }), 200);
      }
    });

    // ── the one moment a bad camera can still be fixed ──────────────────────
    // Calibration quality used to surface only in the report, as a caveat, which
    // told the teacher something useful at the exact point they could no longer
    // act on it. In the room — before Start — it is a thing you walk over and fix,
    // and every false flag it would have caused simply never happens.
    function renderSetupLine() {
      const poor = (read && !CLOSED) ? read.poorSetups : [];
      $("setupline").classList.toggle("hidden", !poor.length);
      if (!poor.length) return;
      $("setuptxt").textContent = poor.length === 1
        ? "1 camera could be better before you start."
        : poor.length + " cameras could be better before you start.";
      $("setupsee").onclick = () => openSetups(poor, $("setupsee"));
    }
    function openSetups(poor, sourceEl) {
      $("popIn").innerHTML =
        '<div class="ptop"><span class="dot warn"></span><h2 id="popName">Worth a quick fix</h2></div>' +
        '<p class="pstat">A better camera position now means fewer doubtful flags later.</p>' +
        '<div class="lab">Cameras</div>' +
        poor.map(x => '<div class="row"><span class="t">' + esc(x.grade) + '</span>' +
          '<span class="w">' + esc(x.p.name) + (x.reason ? ' &middot; ' + esc(x.reason) : "") + '</span></div>').join("") +
        '<div class="caveat">Flags from these students are already weighted lower, because we could not see them as clearly.</div>';
      morphOpen(sourceEl);
    }

    // one line, only when the room itself did something
    function renderRoomLine() {
      const m = read && read.moments.length ? read.moments[read.moments.length - 1] : null;
      $("roomline").classList.toggle("hidden", !m);
      if (!m) return;
      $("roomtxt").textContent = clock(m.startT) + " — " + roomHeadline(m.kind).toLowerCase() + ".";
      $("roomsee").onclick = () => openMoment(m, $("roomsee"));
    }

    // ── tile → popup, as one movement ───────────────────────────────────────
    // The popup is not a new object arriving; it is the tile you pressed, grown.
    // Measure both boxes, park the popup on top of the tile, then let it go.
    let openFrom = null, closeTimer = null;
    function morphOpen(sourceEl) {
      const pop = $("pop"), inner = $("popIn"), wrap = $("popWrap");
      clearTimeout(closeTimer); closeTimer = null;   // a re-open cancels a close still in flight
      wrap.classList.add("on"); wrap.setAttribute("aria-hidden", "false");
      $("scrim").style.display = "block";
      requestAnimationFrame(() => $("scrim").classList.add("on"));
      pop.style.transition = "none"; pop.style.transform = "none"; inner.style.transition = "none"; inner.style.opacity = "1";
      const p = pop.getBoundingClientRect(), s = sourceEl.getBoundingClientRect();
      pop.style.transform = "translate(" + (s.left - p.left) + "px," + (s.top - p.top) + "px) scale(" +
        (s.width / p.width) + "," + (s.height / p.height) + ")";
      inner.style.opacity = "0";
      void pop.offsetWidth;   // commit the parked state before animating away from it
      pop.style.transition = "transform .34s cubic-bezier(.2,.7,.2,1)";
      inner.style.transition = "opacity .2s ease .08s";   // content a beat behind the shape
      pop.style.transform = "none"; inner.style.opacity = "1";
      openFrom = sourceEl;
    }
    function morphClose() {
      const pop = $("pop"), inner = $("popIn"), wrap = $("popWrap");
      if (!wrap.classList.contains("on")) return;
      $("scrim").classList.remove("on");
      const src = openFrom && openFrom.isConnected ? openFrom : null;
      if (src) {
        const p = pop.getBoundingClientRect(), s = src.getBoundingClientRect();
        pop.style.transition = "transform .34s cubic-bezier(.2,.7,.2,1)";
        inner.style.transition = "opacity .16s ease";
        inner.style.opacity = "0";
        pop.style.transform = "translate(" + (s.left - p.left) + "px," + (s.top - p.top) + "px) scale(" +
          (s.width / p.width) + "," + (s.height / p.height) + ")";
      }
      openFrom = null;
      clearTimeout(closeTimer);
      closeTimer = setTimeout(() => {
        closeTimer = null;
        wrap.classList.remove("on"); wrap.setAttribute("aria-hidden", "true");
        $("scrim").style.display = "none";
        pop.style.transition = "none"; pop.style.transform = "none";
      }, src ? 340 : 0);
    }
    $("scrim").onclick = morphClose;
    listen(window, "keydown", e => { if (e.key === "Escape") morphClose(); });

    // ── what the popup says: now, not the whole exam ────────────────────────
    function noteField(prefix, pid) {
      if (!notesOn || CLOSED) return "";
      return '<div class="noteRow"><input id="noteInp" maxlength="300" placeholder="' +
        (pid ? "Say something to " + esc(prefix.split(" ")[0]) : "Add a note") + '" ' +
        'data-prefix="' + esc(prefix || "") + '" data-pid="' + esc(pid || "") + '" aria-label="Add a note">' +
        '<div class="noted" id="noted">' + (pid ? "They see this on their screen." : "") + '</div></div>';
    }
    function wireNote() {
      const inp = $("noteInp"); if (!inp) return;
      setTimeout(() => inp.focus(), 360);
      inp.addEventListener("keydown", e => {
        if (e.key !== "Enter") return;
        const txt = inp.value.trim(); if (!txt) return;
        const prefix = inp.getAttribute("data-prefix"), pid = inp.getAttribute("data-pid") || null;
        const row = { exam_id: examId, text: (prefix ? prefix + " — " : "") + txt };
        if (pid) row.participant_id = pid;

        // The note is written the moment it is typed. It goes to the outbox,
        // which owns it from here — including across a navigation away from
        // this room, which is exactly when a teacher tends to type one and
        // leave. Waiting on the server before admitting the note exists is what
        // used to make this field feel like a web form.
        inp.value = "";
        const say = (m) => { const n = $("noted"); if (n) n.textContent = m; };
        say(pid ? "Sent." : "Noted at " + clock(Date.now()) + ".");

        let downgraded = false;
        send("note:" + (pid || "room"), async () => {
          const r = await sb.from("exam_notes").insert(row).select("at").maybeSingle();
          if (r.error && pid && !downgraded) {   // pre-v10 the column doesn't exist — still record the note
            downgraded = true;
            delete row.participant_id;
            return sb.from("exam_notes").insert(row).select("at").maybeSingle();
          }
          return r;
        }).then(({ ok }) => {
          if (!ok) say("Could not save that note.");
          else if (downgraded) say("Saved to the report, but not sent (needs the v10 update).");
        });
      });
    }

    function openStudent(pid, sourceEl) {
      const s = read && read.students.find(x => x.p.id === pid); if (!s) return;
      const off = !fresh(s.p);
      const recent = s.events.slice(-8).reverse();
      const last = s.events[s.events.length - 1];
      let stat;
      if (off && !CLOSED) stat = "Not connected · last seen " + clock(s.p.last_seen);
      else if (last) stat = label(last.kind) + " · " + ago(last.at);
      else stat = "Looking at screen · settled since " + clock(s.p.joined_at);
      const caveat = s.calib && s.calib.grade && s.calib.grade !== "solid"
        ? '<div class="caveat">Setup was ' + esc(s.calib.grade) +
          (s.calib.reasons && s.calib.reasons.length ? " — " + esc(s.calib.reasons[0]) : "") + ". Read these lightly.</div>" : "";
      $("popIn").innerHTML =
        '<div class="ptop"><span class="dot ' + (s.serious ? "alert" : off ? "" : "ok") + '"></span>' +
        '<h2 id="popName">' + esc(s.p.name) + '</h2></div>' +
        '<p class="pstat">' + esc(stat) + '</p>' +
        (recent.length ? '<div class="lab">So far</div>' + recent.map(e =>
          '<div class="row ' + (ALERT_KINDS.has(e.kind) ? "alert" : "") + '"><span class="t">' + clock(e.at) + '</span>' +
          '<span class="w">' + esc(label(e.kind)) + '</span></div>').join("") : "") +
        caveat + noteField(s.p.name, s.p.id);
      morphOpen(sourceEl); wireNote();
    }

    function openMoment(m, sourceEl) {
      const names = [...m.people].map(id => parts.get(id)).filter(Boolean).map(p => p.name);
      $("popIn").innerHTML =
        '<div class="ptop"><span class="dot warn"></span><h2 id="popName">' + esc(roomHeadline(m.kind)) + '</h2></div>' +
        '<p class="pstat">' + names.length + ' of ' + read.roster.length + ' students · ' + clock(m.startT) + '</p>' +
        '<div class="lab">Who</div>' +
        '<p class="who">' + names.map(esc).join(", ") + '</p>' +
        '<div class="caveat">A whole room flagging together is usually the room, not the students.</div>' +
        noteField("");
      morphOpen(sourceEl); wireNote();
    }

    $("out").addEventListener("click", e => {
      const n = e.target.closest("[data-note]");
      if (n) { e.stopPropagation(); openStudent(n.getAttribute("data-note"), n); }
    });
    $("roomNote").onclick = () => {
      $("popIn").innerHTML = '<div class="ptop"><h2 id="popName">Note the room</h2></div>' +
        '<p class="pstat">Goes into the report beside the machine\'s flags.</p>' + noteField("");
      morphOpen($("roomNote")); wireNote();
    };

    // ── header ──────────────────────────────────────────────────────────────
    function renderHead() {
      const bits = [exam.title.toUpperCase()];
      const started = examStarted(exam);
      if (CLOSED) bits.push("ENDED");
      else if (examPending(exam)) bits.push("NOT STARTED");
      else {
        bits.push("LIVE");
        const left = msLeft(exam);
        if (left != null) bits.push(countdown(left).toUpperCase());
        else {
          const mins = Math.max(0, Math.round((Date.now() - t(exam.starts_at || exam.created_at)) / 60000));
          if (mins >= 1) bits.push(mins + (mins === 1 ? " MINUTE IN" : " MINUTES IN"));
        }
      }
      $("startBtn").classList.toggle("hidden", CLOSED || exam.starts_at != null);
      $("eyebrow").textContent = bits.join(" · ");
      $("h1").textContent = CLOSED ? "Who was in" : "Your room";
      // the clock ran out while nobody pressed anything — write it down once
      if (!CLOSED && examOver(exam)) {
        CLOSED = true;
        sb.from("exams").update({ status: "closed", closed_at: exam.ends_at }).eq("id", examId).then(() => {}, () => {});
      }
    }

    (async () => {
      const user = await cached("me", async () => (await sb.auth.getUser()).data.user, 60_000);
      if (!user) { replace("/exam/"); return; }
      if (!examId) { replace("/exam/console.html"); return; }
      // Usually already in hand: the console starts this read when the pointer
      // reaches the "Live room" link, so by the time the click lands the row is
      // here and the room draws on the first frame.
      const e = await cached("exam:" + examId, () => fetchExam(examId, EXAM_COLS), 8_000);
      // this page is the teacher's — only the exam's owner may watch its room
      if (!e || e.owner !== user.id) { replace("/exam/console.html"); return; }
      exam = e; CLOSED = exam.status === "closed";
      useTimezone(exam.timezone);       // the room's clock is the room's, not the watcher's
      $("code").textContent = exam.code; document.title = "Vigil · " + exam.title;
      renderHead();

      await refresh();

      // notes need migration v7 — the field simply doesn't appear without it
      const nq = await sb.from("exam_notes").select("id").eq("exam_id", examId).limit(1);
      notesOn = !nq.error;
      $("roomNote").classList.toggle("hidden", !notesOn || CLOSED);

      $("startBtn").onclick = async () => {
        const now = new Date();
        const patch = { starts_at: now.toISOString() };
        if (exam.duration_min) patch.ends_at = new Date(now.getTime() + exam.duration_min * 60000).toISOString();
        const { error } = await sb.from("exams").update(patch).eq("id", examId);
        if (error) return;
        Object.assign(exam, patch);
        // the console and this page share one copy of this row; it just changed
        invalidate("exam:" + examId); invalidate("exams:");
        renderHead();
      };

      function applyStatus(status) {
        CLOSED = status === "closed";
        $("roomNote").classList.toggle("hidden", !notesOn || CLOSED);
        renderHead(); render();
      }

      // Nothing here interrupts. A flag elsewhere while a popup is open changes
      // the tile behind it quietly; the teacher meets it when they close.
      channel("exam-" + examId)
        .on("postgres_changes", { event: "*", schema: "public", table: "participants", filter: "exam_id=eq." + examId },
          p => { if (p.eventType === "DELETE") parts.delete(p.old.id); else parts.set(p.new.id, p.new); render(); })
        .on("postgres_changes", { event: "*", schema: "public", table: "events", filter: "exam_id=eq." + examId },
          p => {
            if (p.eventType === "INSERT") { if (!addEvent(p.new)) return; }
            else if (p.eventType === "UPDATE") { const i = events.findIndex(x => x.id === p.new.id); if (i < 0) return; events[i] = p.new; }
            else return;
            render();
          })
        .on("postgres_changes", { event: "UPDATE", schema: "public", table: "exams", filter: "id=eq." + examId },
          p => { if (!p.new) return; Object.assign(exam, p.new); if (p.new.status) applyStatus(p.new.status); else renderHead(); })
        .subscribe();

      // Ask every 4 s regardless of the socket: this is what makes a student appear
      // the moment they join and disappear when they go, with no reload.
      every(2000, refresh);
      every(1000, () => { renderHead(); render(); });   // presence freshness + the eyebrow clock
      // coming back to this tab should never show a stale room
      listen(document, "visibilitychange", () => { if (!document.hidden) refresh(); });
    })();
  </script>
</body>
</html>
