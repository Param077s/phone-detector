<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vigil · Exam report</title>
  <link rel="icon" href="/favicon.svg">
  <meta name="theme-color" content="#f3f2ef">
  <link rel="stylesheet" href="/exam/style.css">
  <style>
    .wrap{max-width:820px;margin:0 auto;padding:26px 22px 80px}
    .bar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
    .bar .sp{flex:1}
    h1{font-size:23px;margin:0 0 4px} .sub{color:var(--muted);font-size:14px;margin:0 0 2px}
    .gen{color:var(--faint);font-size:12px;margin:0 0 20px}
    .backlink{color:var(--ink);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
    .backlink svg{width:15px;height:15px}
    .livepill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
    .livepill i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:lp 1.6s infinite}
    @keyframes lp{0%,100%{opacity:1}50%{opacity:.25}}
    .summary{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 18px}
    .stat{font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
    .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
    .stat.alert{color:var(--alert);background:var(--alert-soft);border-color:#f3c9ca} .stat.alert b{color:var(--alert)}
    .stat.warn{color:var(--warn);background:var(--warn-soft);border-color:#f0dcb6} .stat.warn b{color:var(--warn)}
    .stat.ok{color:var(--ok);background:var(--ok-soft);border-color:#c3e6d5} .stat.ok b{color:var(--ok)}
    .toggle{margin-left:auto;font-size:13px;color:var(--muted);font-weight:600;display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
    .toggle input{accent-color:var(--ink);width:15px;height:15px}
    .sec-h{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700;margin:22px 0 10px}
    .student{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
    .student.hide{display:none}
    .student.pri{border-color:#f3c9ca} .student.pri-w{border-color:#f0dcb6}
    .student h2{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:10px}
    .student h2 .sd{width:9px;height:9px;border-radius:50%;flex:0 0 9px;background:var(--faint)}
    .student h2 .sd.warn{background:var(--warn)} .student h2 .sd.alert{background:var(--alert)}
    .student h2 .n{flex:1} .student h2 .ct{font-size:12.5px;font-weight:600;color:var(--muted)}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
    /* cleared students — compact, collapsed by default */
    .clearbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);margin-bottom:16px}
    .clearbox>summary{list-style:none;cursor:pointer;padding:15px 20px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px}
    .clearbox>summary::-webkit-details-marker{display:none}
    .clearbox>summary .sd{width:9px;height:9px;border-radius:50%;background:var(--ok)}
    .clearbox>summary .cv{margin-left:auto;color:var(--faint);font-size:12px;font-weight:600}
    .clearbox .names{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 18px}
    .clearbox .names span{font-size:13px;padding:5px 11px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
    .moreev{list-style:none} .moreev>summary{list-style:none;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;padding:8px 0}
    .moreev>summary::-webkit-details-marker{display:none}
    .chip{font-size:12.5px;padding:5px 11px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
    .chip b{font-weight:700}
    .chip.warn{color:var(--warn);background:var(--warn-soft);border-color:#f0dcb6}
    .chip.alert{color:var(--alert);background:var(--alert-soft);border-color:#f3c9ca}
    .chip.ok{color:var(--ok);background:var(--ok-soft);border-color:#c3e6d5}
    .tl{position:relative;margin-left:5px;padding-left:20px;border-left:2px solid var(--line)}
    .ev{position:relative;padding:8px 0;font-size:13.5px;display:flex;gap:12px}
    .ev::before{content:"";position:absolute;left:-27px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--faint);box-shadow:0 0 0 3px #fff}
    .ev.warn::before{background:var(--warn)} .ev.alert::before{background:var(--alert)}
    .ev .time{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 78px}
    .ev .what{flex:1}
    .band{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:999px;border:1px solid var(--line)}
    .band.high{color:var(--alert);background:var(--alert-soft);border-color:#f3c9ca}
    .band.medium{color:var(--warn);background:var(--warn-soft);border-color:#f0dcb6}
    .band.low{color:var(--muted);background:var(--soft)}
    /* calibration-quality badge — context for how trustworthy the flags are */
    .setup{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);flex:0 0 auto}
    .setup.s-ok{color:var(--ok);background:var(--ok-soft);border-color:#c3e6d5}
    .setup.s-warn{color:var(--warn);background:var(--warn-soft);border-color:#f0dcb6}
    /* exam strip — when the flags happened, at a glance */
    .strip{position:relative;height:26px;border-radius:8px;background:var(--soft);border:1px solid var(--line);overflow:hidden;margin:2px 0 4px}
    .strip .burst{position:absolute;top:0;bottom:0;border-radius:4px;background:rgba(216,58,63,.10)}
    .strip .tick{position:absolute;top:5px;width:3px;height:16px;border-radius:2px;background:var(--warn);transform:translateX(-50%)}
    .strip .tick.alert{background:var(--alert)}
    .strip .tick.dim{opacity:.22}
    .saxis{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-bottom:8px;font-variant-numeric:tabular-nums}
    .story{font-size:13px;color:var(--ink-2);margin:0 0 12px;line-height:1.5}
    .story b{color:var(--ink);font-weight:600}
    /* episodes — consecutive same-kind flags merged into one row, one decision */
    .eprow{display:flex;align-items:center;gap:12px;padding:9px 6px;border-top:1px solid var(--line);font-size:13.5px;border-radius:8px}
    .eprow .when{flex:0 0 148px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;font-size:12.5px}
    .eprow .what{flex:1;color:var(--ink-2)} .eprow .what em{font-style:normal;color:var(--muted)}
    .eprow .cnt{font-size:11.5px;font-weight:700;color:var(--warn);background:var(--warn-soft);border:1px solid #f0dcb6;border-radius:999px;padding:2px 8px;white-space:nowrap}
    .eprow .cnt.alert{color:var(--alert);background:var(--alert-soft);border-color:#f3c9ca}
    .eprow.dismissed .when,.eprow.dismissed .what{text-decoration:line-through;opacity:.5}
    .eprow .cf{font-size:11px;color:var(--ok);font-weight:600;margin-left:6px}
    .eprow.cur{outline:2px solid var(--ink);outline-offset:-1px;background:#faf9f7}
    /* review inbox — progress + keyboard triage */
    .inbox{position:sticky;top:10px;z-index:5;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:11px 16px;margin:0 0 16px}
    .inbox .ibar{flex:1;height:6px;border-radius:4px;background:var(--soft);overflow:hidden;min-width:60px}
    .inbox .ibar i{display:block;height:100%;background:var(--ink);border-radius:4px;transition:width .25s}
    .inbox .itxt{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
    .inbox .keys{display:flex;gap:5px;align-items:center;font-size:11.5px;color:var(--faint);white-space:nowrap}
    .inbox kbd{font-size:10.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted);background:#fff;font-weight:700;font-family:inherit}
    @media(max-width:640px){.inbox .keys{display:none}}
    /* print-only sign-off block for the verdict PDF */
    .signoff{display:none}
    @media print{
      .inbox{display:none !important}
      .signoff{display:block;margin-top:30px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-2);break-inside:avoid}
      .signoff b{color:var(--ink)}
      .signoff .lines{display:flex;gap:30px;margin-top:26px}
      .signoff .lines span{flex:1;border-top:1px solid var(--ink);padding-top:5px;font-size:11px;color:var(--muted)}
    }
    .rev{display:inline-flex;gap:4px;margin-left:8px;flex:0 0 auto}
    .rb{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:12px;line-height:1;color:var(--muted)}
    .rb:hover{border-color:var(--ink);color:var(--ink)}
    .rb.ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
    .rb.no.on{background:var(--muted);border-color:var(--muted);color:#fff}
    .ev.dismissed .what,.ev.dismissed .time{text-decoration:line-through;opacity:.5}
    .ev .cf{font-size:11px;color:var(--ok);font-weight:600;margin-left:6px}
    @media print{ .rev{display:none !important} }
    .empty{color:var(--muted);text-align:center;padding:40px 0}
    @media print{ body{background:#fff;background-image:none} .bar .btn,.backlink,.toggle{display:none !important}
      .student{box-shadow:none;break-inside:avoid;page-break-inside:avoid;margin-bottom:12px}
      .student.hide{display:block !important} .clearbox .names{display:flex !important}
      .moreev>summary{display:none}
      *{-webkit-print-color-adjust:exact;print-color-adjust:exact} }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <a class="backlink" id="back" href="/exam/console.html"><svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <span class="brand"><span class="mk"><svg viewBox="0 0 24 24" fill="none"><path d="M6 10V7.5A1.5 1.5 0 0 1 7.5 6H10M14 6h2.5A1.5 1.5 0 0 1 18 7.5V10M18 14v2.5a1.5 1.5 0 0 1-1.5 1.5H14M10 18H7.5A1.5 1.5 0 0 1 6 16.5V14" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="2.6" fill="#fff"/></svg></span><b>Vigil</b></span>
      <span class="livepill" id="livePill" style="display:none"><i></i> Live</span>
      <span class="sp"></span>
      <a class="backlink" id="histLink" href="/exam/history.html" style="display:none;margin-right:4px">All exams</a>
      <button class="btn ghost sm" id="csvBtn" style="display:none">Export CSV</button>
      <button class="btn ghost sm" id="pdfBtn" style="display:none">Save as PDF</button>
    </div>
    <h1 id="title">Exam report</h1>
    <p class="sub" id="sub"></p>
    <div class="gen" id="gen"></div>
    <div class="summary" id="summary" style="display:none"></div>
    <div id="out"><div class="empty">Loading…</div></div>
  </div>

  <script type="module">
    import { sb, esc } from "/exam/sb.js";
    const $ = id => document.getElementById(id);
    const examId = new URLSearchParams(location.search).get("e");
    const LABELS = { head_down:"Looked down", look_away:"Looked away", face_absent:"Face not visible", second_face:"Second face detected", phone:"Phone detected", camera_off:"Camera off", monitor_hidden:"Hid / left Vigil", left_exam:"Closed Vigil", virtual_cam:"Virtual camera", calibrated:"Calibrated" };
    const ALERT_KINDS = new Set(["second_face","phone","camera_off","monitor_hidden","left_exam","virtual_cam"]);
    // integrity weighting → a single risk score per student (dismissed flags count 0)
    const WEIGHT = { second_face:5, phone:5, virtual_cam:5, left_exam:4, monitor_hidden:3, camera_off:3, face_absent:1.5, look_away:1, head_down:1 };
    const bandOf = (score) => score>=10 ? "high" : score>=4 ? "medium" : score>0 ? "low" : "clear";
    let reviewEnabled = false;   // teacher + the v6 review column exists
    const CAP = 8;   // episodes shown before a card collapses the rest
    const EP_GAP = 90_000;   // same-kind flags within 90s merge into one episode
    const fmt = (iso) => { const d = new Date(iso); return d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"}); };
    const fmtHM = (iso) => { const d = new Date(iso); return d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); };
    const durTxt = (ms) => { const s = Math.max(1, Math.round(ms/1000)); if (s < 60) return s + " s"; const m = Math.floor(s/60); return m + " min" + (s%60 ? " " + (s%60) + " s" : ""); };

    // consecutive same-kind flags collapse into episodes — one row, one decision
    function episodesOf(evs) {
      const eps = [];
      for (const e of evs) {
        const t = new Date(e.at).getTime();
        const last = eps[eps.length-1];
        if (last && last.kind === e.kind && t - last.endT <= EP_GAP) { last.events.push(e); last.endT = t; last.end = e.at; }
        else eps.push({ kind:e.kind, start:e.at, end:e.at, startT:t, endT:t, events:[e] });
      }
      for (const ep of eps) {
        ep.count = ep.events.length;
        ep.ids = ep.events.map(e => e.id).filter(Boolean);
        ep.alert = ALERT_KINDS.has(ep.kind);
        ep.review = ep.events.every(e => e.review === "dismissed") ? "dismissed"
                  : ep.events.every(e => e.review === "confirmed") ? "confirmed" : null;
      }
      return eps;
    }
    // shared time window so every student's strip lines up (min 10 minutes wide)
    function windowOf(events) {
      const ts = (events||[]).map(e => new Date(e.at).getTime());
      if (!ts.length) return null;
      const lo = Math.min(...ts), hi = Math.max(...ts), mid = (lo+hi)/2;
      const half = Math.max(hi-lo, 10*60*1000) / 2 * 1.06;
      return { min: mid-half, max: mid+half };
    }
    const pct = (t, w) => (((t - w.min) / (w.max - w.min)) * 100).toFixed(2);
    function stripHtml(evs, eps, w) {
      if (!w || !evs.length) return "";
      const bursts = eps.filter(ep => ep.count >= 3)
        .map(ep => '<span class="burst" style="left:'+pct(ep.startT,w)+'%;width:'+Math.max(1.2,(ep.endT-ep.startT)/(w.max-w.min)*100).toFixed(2)+'%"></span>').join("");
      const ticks = evs.map(e => '<span class="tick'+(ALERT_KINDS.has(e.kind)?" alert":"")+(e.review==="dismissed"?" dim":"")+'" style="left:'+pct(new Date(e.at).getTime(),w)+'%"></span>').join("");
      return '<div class="strip">'+bursts+ticks+'</div>'+
        '<div class="saxis"><span>'+fmtHM(new Date(w.min).toISOString())+'</span><span>'+fmtHM(new Date((w.min+w.max)/2).toISOString())+'</span><span>'+fmtHM(new Date(w.max).toISOString())+'</span></div>';
    }
    // one auto-written sentence per student — the report reads itself
    function narrative(eps) {
      if (!eps.length) return "";
      const byKind = {};
      eps.forEach(ep => { const b = byKind[ep.kind] = byKind[ep.kind] || { flags:0, eps:0 }; b.flags += ep.count; b.eps++; });
      const [topKind, top] = Object.entries(byKind).sort((a,b) => b[1].flags - a[1].flags)[0];
      const label = (LABELS[topKind]||topKind).toLowerCase();
      const others = Object.keys(byKind).length - 1;
      const big = eps.filter(e => e.kind === topKind).sort((a,b) => b.count - a.count)[0];
      let s = '<b>'+top.flags+'&times; '+esc(label)+'</b> in '+top.eps+' episode'+(top.eps===1?"":"s");
      if (others > 0) s += ' (+'+others+' other kind'+(others===1?"":"s")+')';
      s += (big && big.count > 1)
        ? ' — heaviest <b>'+big.count+'&times; over '+durTxt(big.endT-big.startT)+'</b> starting '+fmtHM(big.start)+'.'
        : ' — isolated moments, no clustering.';
      return '<div class="story">'+s+'</div>';
    }

    let exam = null, teacher = false, csvRows = [], user = null;
    let notes = [], notesEnabled = false;   // invigilator notes (needs migration v7; darkens gracefully)
    async function fetchNotes() {
      if (!teacher) return [];
      const q = await sb.from("exam_notes").select("at,text").eq("exam_id", examId).order("at",{ascending:true});
      notesEnabled = !q.error;
      return q.error ? [] : (q.data || []);
    }

    // ── review cursor (keyboard triage) ──────────────────────────────────────
    let curKey = null;
    const cursorRows = () => [...document.querySelectorAll(".eprow[data-key]")];
    function setCur(rows, i) {
      rows.forEach(r => r.classList.remove("cur"));
      if (i < 0 || !rows[i]) { curKey = null; return; }
      rows[i].classList.add("cur"); curKey = rows[i].getAttribute("data-key");
      rows[i].scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
    function renderCursor() {
      const rows = cursorRows(); if (!rows.length) return;
      if (curKey == null) return;   // nothing highlighted until the teacher starts navigating
      let i = rows.findIndex(r => r.getAttribute("data-key") === curKey);
      if (i < 0) i = 0;
      rows.forEach(r => r.classList.remove("cur"));
      rows[i].classList.add("cur");
    }
    async function applyReview(ids, val, btn) {
      if (btn) btn.disabled = true;
      try { await sb.from("events").update({ review: val }).in("id", ids); } catch (_) {}
      await fetchAndDraw();
    }

    // build the whole report body from a fresh (parts, events) pull — re-run live
    function draw(parts, events) {
      csvRows = [];
      const byP = new Map();
      (events||[]).forEach(e => { if(!byP.has(e.participant_id)) byP.set(e.participant_id, []); byP.get(e.participant_id).push(e); });
      const roster = (parts||[]).sort((a,b)=> new Date(a.joined_at)-new Date(b.joined_at));
      if (!roster.length){ $("summary").style.display="none";
        $("out").innerHTML = '<div class="empty">'+(teacher ? "No one has joined yet." : "No activity recorded yet.")+'</div>'; return; }

      if (!teacher) { drawStudent(roster, byP); return; }   // personal "Your activity" view

      const win = windowOf(events);   // one shared clock so every strip lines up
      const info = roster.map(p => {
        const all = byP.get(p.id) || [];
        // calibration-quality records ride the events table but are context, not flags
        const calib = all.filter(e => e.kind === "calibrated").map(e => e.meta || {}).pop() || null;
        const evs = all.filter(e => e.kind !== "calibrated");
        const active = evs.filter(e => e.review !== "dismissed");   // dismissed flags don't count
        const counts = {}; let alerts = 0, score = 0;
        active.forEach(e => { counts[e.kind] = (counts[e.kind]||0)+1; if (ALERT_KINDS.has(e.kind)) alerts++; score += (WEIGHT[e.kind]||1); });
        const eps = episodesOf(evs);
        eps.forEach(ep => csvRows.push([p.name, LABELS[ep.kind]||ep.kind, ep.count, fmt(ep.start), fmt(ep.end), ep.review||""]));
        return { p, evs, eps, calib, counts, alerts, flags: active.length, score, band: bandOf(score) };
      });
      const flagged = info.filter(i => i.flags > 0).sort((a,b) => b.score - a.score || a.p.name.localeCompare(b.p.name));
      const clear = info.filter(i => i.flags === 0);

      const stat = (cls,n,label) => '<span class="stat '+cls+'"><b>'+n+'</b> '+label+'</span>';
      const bands = { high:0, medium:0, low:0 };
      flagged.forEach(i => bands[i.band]++);
      $("summary").style.display = "flex";
      $("summary").innerHTML =
        stat("", roster.length, roster.length===1?"student":"students") +
        (bands.high ? stat("alert", bands.high, "high risk") : "") +
        (bands.medium ? stat("warn", bands.medium, "medium") : "") +
        (bands.low ? stat("", bands.low, "low") : "") +
        stat("ok", clear.length, "clear") +
        (flagged.length && clear.length ? '<label class="toggle"><input type="checkbox" id="flagOnly"> Flagged only</label>' : "");

      const epHtml = ep => {
        const dism = ep.review === "dismissed", conf = ep.review === "confirmed";
        const when = ep.count === 1 ? fmt(ep.start) : fmt(ep.start)+"&ndash;"+fmt(ep.end);
        const rev = (reviewEnabled && ep.ids.length)
          ? '<span class="rev"><button class="rb ok '+(conf?"on":"")+'" data-ids="'+ep.ids.join(",")+'" data-act="confirm" title="Confirm episode">✓</button>'+
            '<button class="rb no '+(dism?"on":"")+'" data-ids="'+ep.ids.join(",")+'" data-act="dismiss" title="Dismiss episode">✕</button></span>' : "";
        return '<div class="eprow'+(dism?" dismissed":"")+'" data-key="'+esc(String(ep.ids[0]||ep.startT))+'">'+
          '<span class="when">'+when+'</span>'+
          '<span class="what">'+esc(LABELS[ep.kind]||ep.kind)+
          (ep.count>1 ? ' <em>&middot; over '+durTxt(ep.endT-ep.startT)+'</em>' : '')+
          (conf ? ' <span class="cf">confirmed</span>' : '')+'</span>'+
          (ep.count>1 ? '<span class="cnt'+(ep.alert?" alert":"")+'">'+ep.count+'&times;</span>' : '')+
          rev+'</div>';
      };
      const card = (i) => {
        const p = i.p, eps = i.eps;
        let list;
        if (eps.length <= CAP) list = eps.map(epHtml).join("");
        else { const head = eps.slice(0,CAP).map(epHtml).join(""), rest = eps.slice(CAP).map(epHtml).join("");
          list = head+'<details class="moreev"><summary>Show '+(eps.length-CAP)+' more</summary>'+rest+'</details>'; }
        const setup = i.calib && i.calib.grade
          ? '<span class="setup '+(i.calib.grade==="solid"?"s-ok":"s-warn")+'" title="'+esc((i.calib.reasons||[]).join(", "))+'">setup '+esc(i.calib.grade)+'</span>' : '';
        return '<div class="student '+(i.band==="high"?"pri":"pri-w")+'"><h2><span class="band '+i.band+'">'+i.band+'</span>'+
          '<span class="n">'+esc(p.name)+'</span>'+setup+'<span class="ct">'+i.flags+' flag'+(i.flags===1?"":"s")+' &middot; '+eps.length+' episode'+(eps.length===1?"":"s")+'</span></h2>'+
          stripHtml(i.evs, eps, win)+narrative(eps)+'<div class="eps">'+list+'</div></div>';
      };

      // review inbox — progress across every flagged student's episodes
      let inbox = "";
      if (reviewEnabled && flagged.length) {
        const allEps = flagged.flatMap(i => i.eps);
        const done = allEps.filter(e => e.review).length;
        inbox = '<div class="inbox"><span class="itxt">'+done+' of '+allEps.length+' reviewed</span>'+
          '<span class="ibar"><i style="width:'+(allEps.length ? Math.round(done/allEps.length*100) : 0)+'%"></i></span>'+
          '<span class="keys"><kbd>&uarr;</kbd><kbd>&darr;</kbd> move &nbsp;<kbd>C</kbd> confirm &nbsp;<kbd>X</kbd> dismiss</span></div>';
      }

      // invigilator notes — the human half of the record, beside the machine's
      let notesHtml = "";
      if (notes.length) {
        notesHtml = '<div class="student"><h2><span class="n">Invigilator notes</span><span class="ct">'+notes.length+'</span></h2><div class="eps">'+
          notes.map(n => '<div class="eprow"><span class="when">'+fmt(n.at)+'</span><span class="what">'+esc(n.text)+'</span></div>').join("")+'</div></div>';
        notes.forEach(n => csvRows.push(["— invigilator note", n.text, "", fmt(n.at), "", ""]));
      }

      let html = inbox + notesHtml;
      if (flagged.length) html += '<div class="sec-h">Needs review</div>' + flagged.map(card).join("");
      if (clear.length) {
        const names = clear.map(i => '<span>'+esc(i.p.name)+'</span>').join("");
        html += '<details class="clearbox"'+(clear.length<=6?" open":"")+'><summary><span class="sd"></span>'+
          clear.length+' student'+(clear.length===1?"":"s")+' clear — no flags<span class="cv">tap to '+(clear.length<=6?"hide":"view")+'</span></summary>'+
          '<div class="names">'+names+'</div></details>';
      }
      // print-only sign-off — turns "Save as PDF" into a verdict document
      html += '<div class="signoff"><b>Review sign-off</b>'+
        '<div>Flags are on-device detections intended as aids to human judgement. Episodes above were reviewed in Vigil; dismissed items are struck through and excluded from risk bands.</div>'+
        '<div class="lines"><span>Reviewed by</span><span>Signature</span><span>Date</span></div></div>';
      $("out").innerHTML = html;
      renderCursor();
      const flagOnly = $("flagOnly");
      if (flagOnly) flagOnly.onchange = () => { const cb=document.querySelector(".clearbox"); if(cb) cb.classList.toggle("hide", flagOnly.checked); };
    }

    // a student's own "Your activity" — the SAME episodes the teacher sees, nothing hidden
    function drawStudent(roster, byP) {
      $("summary").style.display = "none";
      const me = roster[0];
      const all = byP.get(me.id) || [];
      const calib = all.filter(e => e.kind === "calibrated").map(e => e.meta || {}).pop() || null;
      const evs = all.filter(e => e.kind !== "calibrated");
      const eps = episodesOf(evs);
      const win = windowOf(all);
      const counts = {}; evs.forEach(e => counts[e.kind] = (counts[e.kind]||0)+1);
      const chips = evs.length
        ? Object.entries(counts).sort((a,b)=> b[1]-a[1])
            .map(([k,n]) => '<span class="chip '+(ALERT_KINDS.has(k)?"alert":"warn")+'"><b>'+n+'</b> '+esc(LABELS[k]||k)+'</span>').join("")
        : '<span class="chip ok">No flags — you were clear throughout</span>';
      const epHtml = ep => {
        const when = ep.count === 1 ? fmt(ep.start) : fmt(ep.start)+"&ndash;"+fmt(ep.end);
        return '<div class="eprow'+(ep.review==="dismissed"?" dismissed":"")+'"><span class="when">'+when+'</span>'+
          '<span class="what">'+esc(LABELS[ep.kind]||ep.kind)+
          (ep.count>1 ? ' <em>&middot; over '+durTxt(ep.endT-ep.startT)+'</em>' : '')+
          (ep.review==="confirmed" ? ' <span class="cf">confirmed</span>' : '')+'</span>'+
          (ep.count>1 ? '<span class="cnt'+(ep.alert?" alert":"")+'">'+ep.count+'&times;</span>' : '')+'</div>';
      };
      const setup = calib && calib.grade
        ? '<span class="setup '+(calib.grade==="solid"?"s-ok":"s-warn")+'" title="'+esc((calib.reasons||[]).join(", "))+'">setup '+esc(calib.grade)+'</span>' : '';
      $("out").innerHTML = '<div class="student"><h2><span class="n">'+esc(me.name)+'</span>'+setup+
        '<span class="ct">'+evs.length+' flag'+(evs.length===1?"":"s")+(eps.length?' &middot; '+eps.length+' episode'+(eps.length===1?"":"s"):'')+'</span></h2>'+
        '<div class="chips">'+chips+'</div>'+stripHtml(evs, eps, win)+(eps.length?narrative(eps):'')+
        (eps.length ? '<div class="eps">'+eps.map(epHtml).join("")+'</div>' : '')+'</div>';
    }

    async function fetchEvents() {
      // prefer the reviewable shape (needs the v6 column); fall back so the report works pre-migration
      let q = await sb.from("events").select("id,participant_id,kind,severity,at,review,meta").eq("exam_id", examId).order("at",{ascending:true});
      if (q.error) { reviewEnabled = false;
        q = await sb.from("events").select("participant_id,kind,severity,at,meta").eq("exam_id", examId).order("at",{ascending:true}); }
      else { reviewEnabled = teacher; }
      return q.data || [];
    }
    async function fetchAndDraw() {
      // RLS scopes these; a student view also narrows to their own row (covers an owner who joined)
      let pq = sb.from("participants").select("id,name,status,joined_at").eq("exam_id", examId);
      if (!teacher && user) pq = pq.eq("user_id", user.id);
      const [{ data:parts }, events, ns] = await Promise.all([ pq, fetchEvents(), fetchNotes() ]);
      notes = ns;
      draw(parts, events);
    }

    (async () => {
      const { data:{ user:u } } = await sb.auth.getUser();
      if (!u || !examId) { location.replace("/exam/"); return; }
      user = u;
      const { data:e } = await sb.from("exams").select("title,code,status,created_at,owner").eq("id", examId).maybeSingle();
      exam = e;
      // Role by CONTEXT first (how you got here), then ownership. The room opens activity
      // with ?as=student and remembers vg_role=student, so the exam's OWNER who joined their
      // own room stays in the student view — 'back' returns to the room, never the console.
      const asParam = new URLSearchParams(location.search).get("as");
      const actingStudent = asParam === "student"
        || (asParam !== "teacher" && localStorage.getItem("vg_role") === "student");
      teacher = !actingStudent && !!exam && exam.owner === user.id;
      const open = !!exam && exam.status === "open";

      if (teacher) { $("back").href = "/exam/console.html"; }
      else { $("back").href = open ? "/exam/room.html?e=" + examId : "/exam/"; $("histLink").style.display = ""; }

      $("title").textContent = teacher ? "Exam report" : "Your activity";
      if (exam){ $("sub").textContent = exam.title + " · code " + exam.code + " · " + exam.status;
        document.title = "Vigil · " + exam.title; }
      $("gen").textContent = "Generated " + new Date().toLocaleString();
      if (open) $("livePill").style.display = "";

      if (teacher){
        $("csvBtn").style.display=""; $("pdfBtn").style.display="";
        $("csvBtn").onclick = () => {
          const csv = "Student,Event,Count,Start,End,Review\n" + csvRows.map(r => r.map(x => '"'+String(x).replace(/"/g,'""')+'"').join(",")).join("\n");
          const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
          a.download = (exam?exam.title:"exam") + "-report.csv"; a.click();
        };
        $("pdfBtn").onclick = () => window.print();
        // Confirm / Dismiss a whole EPISODE (delegation survives redraws — #out stays put)
        $("out").addEventListener("click", async (e) => {
          const b = e.target.closest(".rb"); if (!b) return;
          const row = b.closest(".eprow"); if (row) curKey = row.getAttribute("data-key");
          const val = b.classList.contains("on") ? null : (b.getAttribute("data-act") === "confirm" ? "confirmed" : "dismissed");
          await applyReview(b.getAttribute("data-ids").split(","), val, b);
        });
        // keyboard triage: arrows move, C confirms, X dismisses the highlighted episode
        document.addEventListener("keydown", async (e) => {
          if (e.metaKey || e.ctrlKey || e.altKey) return;
          const rows = cursorRows(); if (!rows.length) return;
          const k = e.key.toLowerCase();
          let i = rows.findIndex(r => r.classList.contains("cur"));
          if (k === "arrowdown" || k === "j") { e.preventDefault(); setCur(rows, Math.min(rows.length-1, i+1)); }
          else if (k === "arrowup" || k === "k") { e.preventDefault(); setCur(rows, Math.max(0, i-1)); }
          else if ((k === "c" || k === "x") && i >= 0) {
            e.preventDefault();
            const btn = rows[i].querySelector(k === "c" ? ".rb.ok" : ".rb.no"); if (!btn) return;
            const val = btn.classList.contains("on") ? null : (k === "c" ? "confirmed" : "dismissed");
            const next = rows[i+1]; curKey = next ? next.getAttribute("data-key") : rows[i].getAttribute("data-key");
            await applyReview(btn.getAttribute("data-ids").split(","), val, btn);
          }
        });
      }

      await fetchAndDraw();

      // LIVE: while the exam is open, new events + status changes stream straight in
      if (open){
        let t; const deb = () => { clearTimeout(t); t = setTimeout(fetchAndDraw, 600); };
        sb.channel("report-"+examId)
          .on("postgres_changes", { event:"*", schema:"public", table:"events", filter:"exam_id=eq."+examId }, deb)
          .on("postgres_changes", { event:"*", schema:"public", table:"participants", filter:"exam_id=eq."+examId }, deb)
          .on("postgres_changes", { event:"UPDATE", schema:"public", table:"exams", filter:"id=eq."+examId },
            (p) => { if (p.new && p.new.status){ $("livePill").style.display = p.new.status === "open" ? "" : "none";
              if (exam){ exam.status = p.new.status; $("sub").textContent = exam.title + " · code " + exam.code + " · " + exam.status; } } })
          .subscribe();
        if (notesEnabled)
          sb.channel("notes-"+examId)
            .on("postgres_changes", { event:"*", schema:"public", table:"exam_notes", filter:"exam_id=eq."+examId }, deb)
            .subscribe();
        const poll = setInterval(async () => {
          const { data } = await sb.from("exams").select("status").eq("id", examId).maybeSingle();
          if (data && data.status !== "open"){ $("livePill").style.display = "none"; clearInterval(poll); }
        }, 15000);
      }

      // make sure PDF/print shows everything, then restore the tidy view
      addEventListener("beforeprint", () => document.querySelectorAll("details").forEach(d => { d.dataset.o = d.open?"1":""; d.open = true; }));
      addEventListener("afterprint", () => document.querySelectorAll("details").forEach(d => { d.open = d.dataset.o==="1"; }));
    })();
  </script>
