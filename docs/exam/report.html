<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vigil · Exam report</title>
  <link rel="icon" href="/favicon.svg">
  <meta name="theme-color" content="#f3f2ef">
  <link rel="stylesheet" href="/exam/style.css">
  <style>
    .wrap{max-width:820px;margin:0 auto;padding:26px 22px 80px}
    .bar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
    .bar .sp{flex:1}
    h1{font-size:23px;margin:0 0 4px} .sub{color:var(--muted);font-size:14px;margin:0 0 2px}
    .gen{color:var(--faint);font-size:12px;margin:0 0 20px}
    .backlink{color:var(--ink);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
    .backlink svg{width:15px;height:15px}
    .livepill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
    .livepill i{width:8px;height:8px;border-radius:50%;corner-shape:round;background:var(--ok);animation:lp 1.6s infinite}
    @keyframes lp{0%,100%{opacity:1}50%{opacity:.25}}
    .sec-h{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700;margin:22px 0 10px}
    .student{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px 14px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
    /* anything the chart can filter away — cards, and the two collapsed boxes */
    .student.hide,.clearbox.hide,.sec-h.hide{display:none}
    .student.pri{border-color:#f3c9ca} .student.pri-w{border-color:#f0dcb6}
    .student h2{font-size:17px;margin:0 0 14px;display:flex;align-items:center;gap:10px}
    .student h2 .sd{width:9px;height:9px;border-radius:50%;corner-shape:round;flex:0 0 9px;background:var(--faint)}
    .student h2 .sd.warn{background:var(--warn)} .student h2 .sd.alert{background:var(--alert)}
    .student h2 .n{flex:1} .student h2 .ct{font-size:12.5px;font-weight:600;color:var(--muted)}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
    /* cleared students — compact, collapsed by default */
    .clearbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);margin-bottom:16px}
    .clearbox>summary{list-style:none;cursor:pointer;padding:15px 20px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px}
    .clearbox>summary::-webkit-details-marker{display:none}
    .clearbox>summary .sd{width:9px;height:9px;border-radius:50%;corner-shape:round;background:var(--ok);flex:0 0 auto}
    /* no monitoring data — hollow, because it is neither a pass nor a flag */
    .clearbox>summary .sd.nd{background:none;border:1.5px dashed var(--faint)}
    .clearbox>summary .cv{margin-left:auto;color:var(--faint);font-size:12px;font-weight:600}
    .clearbox .names{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 18px}
    .clearbox .names span{font-size:13px;padding:5px 11px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
    .moreev{list-style:none} .moreev>summary{list-style:none;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;padding:8px 0}
    .moreev>summary::-webkit-details-marker{display:none}
    .chip{font-size:12.5px;padding:5px 11px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
    .chip b{font-weight:700}
    .chip.warn{color:var(--warn);background:var(--warn-soft);border-color:#f0dcb6}
    .chip.alert{color:var(--alert);background:var(--alert-soft);border-color:#f3c9ca}
    .chip.ok{color:var(--ok);background:var(--ok-soft);border-color:#c3e6d5}
    .tl{position:relative;margin-left:5px;padding-left:20px;border-left:2px solid var(--line)}
    .ev{position:relative;padding:8px 0;font-size:13.5px;display:flex;gap:12px}
    .ev::before{content:"";position:absolute;left:-27px;top:14px;width:9px;height:9px;border-radius:50%;corner-shape:round;background:var(--faint);box-shadow:0 0 0 3px #fff}
    .ev.warn::before{background:var(--warn)} .ev.alert::before{background:var(--alert)}
    .ev .time{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 78px}
    .ev .what{flex:1}
    .band{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
    .band.high{color:var(--alert);background:var(--alert-soft);border-color:#f3c9ca}
    .band.medium{color:var(--warn);background:var(--warn-soft);border-color:#f0dcb6}
    .band.low{color:var(--muted);background:var(--soft)}
    .band.clear{color:var(--ok);background:var(--ok-soft);border-color:#c3e6d5}
    .band.unverified{color:var(--muted);background:var(--soft);border-style:dashed;border-color:var(--line-strong)}
    /* calibration-quality badge — context for how trustworthy the flags are */
    .setup{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);flex:0 0 auto}
    .setup.s-ok{color:var(--ok);background:var(--ok-soft);border-color:#c3e6d5}
    .setup.s-warn{color:var(--warn);background:var(--warn-soft);border-color:#f0dcb6}
    .story{font-size:13px;color:var(--ink-2);margin:2px 0 6px;line-height:1.5}
    .story b{color:var(--ink);font-weight:600}
    /* the student's own account — the one place on any Vigil page where the person
       being watched writes something, so it is given room rather than a tooltip */
    .say{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
    .say h3{font-size:13.5px;font-weight:600;margin:0 0 4px}
    .sayhint{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0 0 12px}
    /* flex-start, not baseline: once a textarea opens in .sv, a baseline row drags
       the kind label down to the box's last line */
    .sayrow{display:flex;gap:12px;align-items:flex-start;padding:9px 8px;margin:0 -8px;border-radius:8px;
      cursor:text;transition:background .15s}
    .sayrow:hover{background:var(--soft)}
    .sayrow .sk{flex:0 0 128px;font-size:12.5px;font-weight:600;color:var(--muted);padding-top:2px}
    .sayrow .sv{flex:1;font-size:13.5px;color:var(--ink);line-height:1.5}
    .sayrow .sv.none{color:var(--faint)}
    .sayrow textarea{width:100%;font:inherit;font-size:13.5px;color:var(--ink);background:#fff;
      border:1px solid var(--line);border-radius:6px;padding:7px 9px;resize:vertical;min-height:54px}
    /* episodes — consecutive same-kind flags merged into one row, one decision */
    .eprow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line);font-size:13.5px;border-radius:8px}
    .eprow .when{flex:0 0 74px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;font-size:12.5px;white-space:nowrap}
    .eprow .what{flex:1;color:var(--ink);font-weight:500}
    .eprow .cnt{font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
    .eprow .cnt.alert{color:var(--alert)}
    .eprow.dismissed .when,.eprow.dismissed .what{text-decoration:line-through;opacity:.5}
    .eprow .cf{font-size:11px;color:var(--ok);font-weight:600;margin-left:6px}
    .eprow .cf.ds{color:var(--warn)}
    .eprow.cur{outline:2px solid var(--ink);outline-offset:-1px;background:#faf9f7}
    /* review inbox — progress + keyboard triage */
    .inbox{position:sticky;top:10px;z-index:5;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:11px 16px;margin:0 0 16px}
    .inbox .sp{flex:1}
    .inbox .itxt{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
    .inbox .keys{display:flex;gap:5px;align-items:center;font-size:11.5px;color:var(--faint);white-space:nowrap}
    .inbox kbd{font-size:10.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted);background:#fff;font-weight:700;font-family:inherit}
    @media(max-width:640px){.inbox .keys{display:none}}
    /* print-only sign-off block for the verdict PDF */
    .signoff{display:none}
    @media print{
      .inbox{display:none !important}
      .signoff{display:block;margin-top:30px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-2);break-inside:avoid}
      .signoff b{color:var(--ink)}
      .signoff .lines{display:flex;gap:30px;margin-top:26px}
      .signoff .lines span{flex:1;border-top:1px solid var(--ink);padding-top:5px;font-size:11px;color:var(--muted)}
    }
    .rev{display:inline-flex;gap:4px;margin-left:8px;flex:0 0 auto}
    .rb{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:12px;line-height:1;color:var(--muted)}
    .rb:hover{border-color:var(--ink);color:var(--ink)}
    .rb.ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
    .rb.no.on{background:var(--muted);border-color:var(--muted);color:#fff}
    .ev.dismissed .what,.ev.dismissed .time{text-decoration:line-through;opacity:.5}
    .ev .cf{font-size:11px;color:var(--ok);font-weight:600;margin-left:6px}
    @media print{ .rev{display:none !important} }
    .empty{color:var(--muted);text-align:center;padding:40px 0}
    @media print{ body{background:#fff;background-image:none} .bar .btn,.backlink{display:none !important}
      .student{box-shadow:none;break-inside:avoid;page-break-inside:avoid;margin-bottom:12px}
      /* a filtered screen must never print as a partial record */
      .student.hide,.clearbox.hide,.sec-h.hide{display:revert !important} .clearbox .names{display:flex !important}
      .moreev>summary{display:none}
      *{-webkit-print-color-adjust:exact;print-color-adjust:exact} }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <a class="backlink" id="back" href="/exam/console.html"><svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <span class="brand"><span class="mk"><svg viewBox="0 0 24 24" fill="none"><path d="M6 10V7.5A1.5 1.5 0 0 1 7.5 6H10M14 6h2.5A1.5 1.5 0 0 1 18 7.5V10M18 14v2.5a1.5 1.5 0 0 1-1.5 1.5H14M10 18H7.5A1.5 1.5 0 0 1 6 16.5V14" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="2.6" fill="#fff"/></svg></span><b>Vigil</b></span>
      <span class="livepill" id="livePill" style="display:none"><i></i> Live</span>
      <span class="sp"></span>
      <a class="backlink" id="histLink" href="/exam/history.html" style="display:none;margin-right:4px">All exams</a>
      <button class="btn ghost sm" id="csvBtn" style="display:none">Export CSV</button>
      <a class="btn ghost sm" id="pdfBtn" style="display:none">Findings</a>
    </div>
    <h1 id="title">Exam report</h1>
    <p class="sub" id="sub"></p>
    <div class="gen" id="gen"></div>
    <div class="chart" id="chart" style="display:none"></div>
    <div id="out"><div class="empty">Loading…</div></div>
  </div>

  <script type="module">
    import { sb, fetchExam } from "/exam/sb.js";
    // This page used to carry its own labels, weights, bands and episode logic — a
    // second opinion about the same events that could drift from the document's.
    // It reads the exam through the shared core now; only the LAYOUT is local.
    import { esc, label, ALERT_KINDS, readExam, clock, clockSec, useTimezone, tzNote,
             RISK_BANDS, bandCounts, bandLabel } from "/exam/exam-core.js";
    const $ = id => document.getElementById(id);
    const examId = new URLSearchParams(location.search).get("e");
    let reviewEnabled = false;   // teacher + the v6 review column exists
    let findingNotes = [], notesOn = false;   // what the two of them said (v14)
    // WHICH EVENTS ARE THE EXAM. This page read the whole sitting while the findings
    // document read only exam time, so the same student could be 6.0 warn on one page
    // and 2.3 quiet on the other — the two surfaces disagreeing about the same events,
    // which reading through one core was supposed to make impossible. One helper, used
    // by both call sites here, so they cannot drift apart again either.
    const readOpts = () => ({ startsAt: exam && exam.starts_at, endsAt: exam && exam.ends_at, notes: findingNotes });
    const CAP = 8;   // episodes shown before a card collapses the rest
    // compact clock — no AM/PM on every row (it wrapped onto two lines); the
    // meridiem lives once in the strip's axis and in "Generated …" above.
    // Both read the EXAM's zone, via the core, rather than pulling the hour off a
    // local Date — a record that says a different hour to each reader isn't one.
    const fmt = (iso) => clockSec(iso).replace(/\s*[AP]\.?M\.?$/i, "");
    const fmtHM = (iso) => clock(iso);
    const durTxt = (ms) => { const s = Math.max(1, Math.round(ms/1000)); if (s < 60) return s + " s"; const m = Math.floor(s/60); return m + " min" + (s%60 ? " " + (s%60) + " s" : ""); };

    // the shared episodesOf works in timestamps; this view prints clock strings
    const epStart = ep => new Date(ep.startT).toISOString();
    const epEnd   = ep => new Date(ep.endT).toISOString();

    // one auto-written sentence per student — the report reads itself
    function narrative(eps) {
      if (!eps.length) return "";
      const byKind = {};
      eps.forEach(ep => { const b = byKind[ep.kind] = byKind[ep.kind] || { flags:0, eps:0 }; b.flags += ep.count; b.eps++; });
      const [topKind, top] = Object.entries(byKind).sort((a,b) => b[1].flags - a[1].flags)[0];
      const top1 = label(topKind).toLowerCase();
      const big = eps.filter(e => e.kind === topKind).sort((a,b) => b.count - a.count)[0];
      // plain English — a sentence a teacher can read once and act on
      let s = 'Mostly <b>'+esc(top1)+'</b> — '+top.flags+' time'+(top.flags===1?"":"s")+'.';
      if (big && big.count > 1) s += ' The worst run was around <b>'+fmtHM(epStart(big))+'</b>.';
      else s += ' Spread out, with no single bad stretch.';
      return '<div class="story">'+s+'</div>';
    }

    // ── the class at a glance ────────────────────────────────────────────────
    // The strip of counts this replaces answered "how many" and nothing else. A
    // hundred students is a shape, and the shape is the first thing a teacher
    // wants — then the ability to press the red part and see only those ten.
    //
    // The chosen band SURVIVES the five-second live redraw, because a teacher
    // reading the ten high-risk students during a running exam should not have
    // the list thrown back at them every time an event arrives.
    let bandFilter = null, lastCounts = null, lastTotal = 0;

    function drawChart(counts, total) {
      if (counts) { lastCounts = counts; lastTotal = total; }
      counts = lastCounts; total = lastTotal;
      if (!counts || !total) { $("chart").style.display = "none"; return; }
      // a band that has emptied out since it was chosen stops being a filter,
      // rather than leaving the page showing nothing and no way back
      if (bandFilter && !counts[bandFilter]) bandFilter = null;
      const bands = RISK_BANDS.filter(b => counts[b.key] > 0);
      const sel = b => bandFilter === b.key ? " sel" : "";
      const seg = b => '<button type="button" class="cseg '+b.key+sel(b)+'" data-band="'+b.key+'"'+
        ' style="flex-grow:'+counts[b.key]+'" title="'+counts[b.key]+' '+b.label+'"'+
        ' aria-pressed="'+(bandFilter===b.key)+'" aria-label="'+counts[b.key]+' '+b.label+'"></button>';
      const key = b => '<button type="button" class="ckey '+b.key+sel(b)+'" data-band="'+b.key+'"'+
        ' aria-pressed="'+(bandFilter===b.key)+'"><i></i><b>'+counts[b.key]+'</b> '+b.label+'</button>';
      const hint = bandFilter
        ? "showing " + bandLabel(bandFilter) + " — press again for everyone"
        : total + " student" + (total===1?"":"s") + " · press a band to see only those";
      $("chart").style.display = "";
      $("chart").innerHTML = '<div class="cbar">'+bands.map(seg).join("")+'</div>'+
        '<div class="ckeys">'+bands.map(key).join("")+'<span class="chint">'+hint+'</span></div>';
      applyBandFilter();
    }

    // One pass over everything the chart can hide. Cards, the clear box and the
    // no-data box all carry data-band, so the filter never needs to know which
    // kind of thing it is looking at.
    function applyBandFilter() {
      $("chart").classList.toggle("on", !!bandFilter);
      let shown = 0;
      document.querySelectorAll("#out [data-band]").forEach(el => {
        const hit = !bandFilter || el.getAttribute("data-band") === bandFilter;
        el.classList.toggle("hide", !hit);
        if (hit && el.classList.contains("student")) shown++;
      });
      const h = document.querySelector(".sec-h");
      if (h) h.classList.toggle("hide", shown === 0);
      // choosing a collapsed band should open it — otherwise pressing "clear"
      // filters the page down to a summary line that is still shut
      if (bandFilter === "clear" || bandFilter === "unverified") {
        const box = document.querySelector('.clearbox[data-band="'+bandFilter+'"]');
        if (box) box.open = true;
      }
    }

    $("chart").addEventListener("click", e => {
      const b = e.target.closest("[data-band]"); if (!b) return;
      const k = b.getAttribute("data-band");
      bandFilter = bandFilter === k ? null : k;
      drawChart();
    });

    let exam = null, teacher = false, csvRows = [], user = null;
    let notes = [], notesEnabled = false;   // invigilator notes (needs migration v7; darkens gracefully)
    async function fetchNotes() {
      if (!teacher) return [];
      const q = await sb.from("exam_notes").select("at,text").eq("exam_id", examId).order("at",{ascending:true});
      notesEnabled = !q.error;
      return q.error ? [] : (q.data || []);
    }

    // ── review cursor (keyboard triage) ──────────────────────────────────────
    let curKey = null;
    const cursorRows = () => [...document.querySelectorAll(".eprow[data-key]")];
    function setCur(rows, i) {
      rows.forEach(r => r.classList.remove("cur"));
      if (i < 0 || !rows[i]) { curKey = null; return; }
      rows[i].classList.add("cur"); curKey = rows[i].getAttribute("data-key");
      rows[i].scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
    function renderCursor() {
      const rows = cursorRows(); if (!rows.length) return;
      if (curKey == null) return;   // nothing highlighted until the teacher starts navigating
      let i = rows.findIndex(r => r.getAttribute("data-key") === curKey);
      if (i < 0) i = 0;
      rows.forEach(r => r.classList.remove("cur"));
      rows[i].classList.add("cur");
    }
    async function applyReview(ids, val, btn) {
      if (btn) btn.disabled = true;
      try { await sb.from("events").update({ review: val }).in("id", ids); } catch (_) {}
      await fetchAndDraw();
    }

    // build the whole report body from a fresh (parts, events) pull — re-run live
    function draw(parts, events) {
      csvRows = [];
      const roster = (parts||[]).sort((a,b)=> new Date(a.joined_at)-new Date(b.joined_at));
      if (!roster.length){ $("chart").style.display="none";
        $("out").innerHTML = '<div class="empty">'+(teacher ? "No one has joined yet." : "No activity recorded yet.")+'</div>'; return; }

      if (!teacher) { drawStudent(roster, events || []); return; }   // personal "Your activity" view

      // one shared reading — the same scores, episodes and room-wide handling the
      // findings document uses, so the two can no longer tell different stories
      const read = readExam(parts || [], events || [], readOpts());
      const info = read.students.map(st => {
        st.episodes.forEach(ep => csvRows.push([st.p.name, label(ep.kind), ep.count,
          fmt(epStart(ep)), fmt(epEnd(ep)), ep.review || ""]));
        return { p: st.p, evs: st.events, eps: st.episodes, calib: st.calib, counts: st.counts,
                 flags: st.live.length, score: st.score, band: st.risk, unverified: st.unverified };
      });
      const flagged = info.filter(i => i.flags > 0).sort((a,b) => b.score - a.score || a.p.name.localeCompare(b.p.name));
      // A student who never completed setup used to sit in the clear box beside
      // students we actually watched. We have no evidence about them either way,
      // and that is not the same result — so they are counted, and listed, apart.
      const clear = info.filter(i => i.flags === 0 && !i.unverified);
      const nodata = info.filter(i => i.flags === 0 && i.unverified);

      // one clean line per episode: when · what · how much · decide
      const epHtml = ep => {
        const dism = ep.review === "dismissed", conf = ep.review === "confirmed",
              disc = ep.review === "discuss";
        const rev = (reviewEnabled && ep.ids.length)
          ? '<span class="rev"><button class="rb ok '+(conf?"on":"")+'" data-ids="'+ep.ids.join(",")+'" data-act="confirm" title="Confirm">✓</button>'+
            '<button class="rb no '+(dism?"on":"")+'" data-ids="'+ep.ids.join(",")+'" data-act="dismiss" title="Dismiss">✕</button></span>' : "";
        return '<div class="eprow'+(dism?" dismissed":"")+'" data-key="'+esc(String(ep.ids[0]||ep.startT))+'">'+
          '<span class="when">'+fmt(epStart(ep))+'</span>'+
          '<span class="what">'+esc(label(ep.kind))+
          (conf ? ' <span class="cf">upheld</span>' : '')+
          (disc ? ' <span class="cf ds">to discuss</span>' : '')+'</span>'+
          (ep.count>1 ? '<span class="cnt'+(ep.alert?" alert":"")+'">'+ep.count+'&times; &middot; '+durTxt(ep.endT-ep.startT)+'</span>' : '')+
          rev+'</div>';
      };
      const card = (i) => {
        const p = i.p, eps = i.eps;
        let list;
        if (eps.length <= CAP) list = eps.map(epHtml).join("");
        else { const head = eps.slice(0,CAP).map(epHtml).join(""), rest = eps.slice(CAP).map(epHtml).join("");
          list = head+'<details class="moreev"><summary>Show '+(eps.length-CAP)+' more</summary>'+rest+'</details>'; }
        // the setup badge only appears when it's a caveat worth knowing
        const setup = i.calib && i.calib.grade && i.calib.grade !== "solid"
          ? '<span class="setup s-warn" title="'+esc((i.calib.reasons||[]).join(", "))+'">setup '+esc(i.calib.grade)+'</span>' : '';
        return '<div class="student '+(i.band==="high"?"pri":"pri-w")+'" data-band="'+i.band+'">'+
          '<h2><span class="band '+i.band+'">'+esc(bandLabel(i.band).replace(" risk",""))+'</span>'+
          '<span class="n">'+esc(p.name)+'</span>'+setup+'<span class="ct">'+i.flags+' flag'+(i.flags===1?"":"s")+'</span></h2>'+
          narrative(eps)+'<div class="eps">'+list+'</div></div>';
      };

      // review inbox — progress across every flagged student's episodes
      let inbox = "";
      if (reviewEnabled && flagged.length) {
        const allEps = flagged.flatMap(i => i.eps);
        const done = allEps.filter(e => e.review).length;
        inbox = '<div class="inbox"><span class="itxt">'+done+' of '+allEps.length+' reviewed</span>'+
          '<span class="sp"></span>'+
          '<span class="keys"><kbd>&uarr;</kbd><kbd>&darr;</kbd> move &nbsp;<kbd>C</kbd> confirm &nbsp;<kbd>X</kbd> dismiss</span></div>';
      }

      // invigilator notes — the human half of the record, beside the machine's
      let notesHtml = "";
      if (notes.length) {
        notesHtml = '<div class="student"><h2><span class="n">Invigilator notes</span><span class="ct">'+notes.length+'</span></h2><div class="eps">'+
          notes.map(n => '<div class="eprow"><span class="when">'+fmt(n.at)+'</span><span class="what">'+esc(n.text)+'</span></div>').join("")+'</div></div>';
        notes.forEach(n => csvRows.push(["— invigilator note", n.text, "", fmt(n.at), "", ""]));
      }

      let html = inbox + notesHtml;
      if (flagged.length) html += '<div class="sec-h">Needs review</div>' + flagged.map(card).join("");
      const box = (list, band, dotCls, txt) => {
        if (!list.length) return "";
        const names = list.map(i => '<span>'+esc(i.p.name)+'</span>').join("");
        return '<details class="clearbox" data-band="'+band+'"'+(list.length<=6?" open":"")+'>'+
          '<summary><span class="sd '+dotCls+'"></span>'+txt(list.length)+
          '<span class="cv">tap to '+(list.length<=6?"hide":"view")+'</span></summary>'+
          '<div class="names">'+names+'</div></details>';
      };
      html += box(clear, "clear", "", n => n+' student'+(n===1?"":"s")+' clear — no flags');
      html += box(nodata, "unverified", "nd", n => n+' student'+(n===1?"":"s")+
        ' with no monitoring data — setup never completed');
      // print-only sign-off — turns "Save as PDF" into a verdict document
      html += '<div class="signoff"><b>Review sign-off</b>'+
        '<div>Flags are on-device detections intended as aids to human judgement. Episodes above were reviewed in Vigil; dismissed items are struck through and excluded from risk bands.</div>'+
        '<div class="lines"><span>Reviewed by</span><span>Signature</span><span>Date</span></div></div>';
      $("out").innerHTML = html;
      renderCursor();
      drawChart(bandCounts(read.students), read.students.length);
    }

    // a student's own "Your activity" — the SAME episodes the teacher sees, nothing hidden
    function drawStudent(roster, events) {
      $("chart").style.display = "none";
      // the student sees exactly what the teacher sees about them — same reading,
      // same episodes, same verdicts, no second opinion
      const me = readExam(roster, events, readOpts()).students[0];
      if (!me) { $("out").innerHTML = '<div class="empty">No activity recorded yet.</div>'; return; }
      const calib = me.calib, evs = me.events, eps = me.episodes, counts = me.counts;
      const chips = evs.length
        ? Object.entries(counts).sort((a,b)=> b[1]-a[1])
            .map(([k,n]) => '<span class="chip '+(ALERT_KINDS.has(k)?"alert":"warn")+'"><b>'+n+'</b> '+esc(label(k))+'</span>').join("")
        : '<span class="chip ok">No flags — you were clear throughout</span>';
      const epHtml = ep => {
        const when = ep.count === 1 ? fmt(epStart(ep)) : fmt(epStart(ep))+"&ndash;"+fmt(epEnd(ep));
        return '<div class="eprow'+(ep.review==="dismissed"?" dismissed":"")+'"><span class="when">'+when+'</span>'+
          '<span class="what">'+esc(label(ep.kind))+
          (ep.count>1 ? ' <em>&middot; over '+durTxt(ep.endT-ep.startT)+'</em>' : '')+
          (ep.review==="confirmed" ? ' <span class="cf">upheld</span>' : '')+
          (ep.review==="discuss" ? ' <span class="cf ds">to discuss</span>' : '')+'</span>'+
          (ep.count>1 ? '<span class="cnt'+(ep.alert?" alert":"")+'">'+ep.count+'&times;</span>' : '')+'</div>';
      };
      const setup = calib && calib.grade && calib.grade !== "solid"
        ? '<span class="setup s-warn" title="'+esc((calib.reasons||[]).join(", "))+'">setup '+esc(calib.grade)+'</span>' : '';
      // Where the student gets to speak. One line per kind they were flagged for —
      // the same unit the teacher reads as a finding, so what they write lands
      // beside the thing it explains rather than in a pile at the end.
      const say = (notesOn && evs.length)
        ? '<div class="say"><h3>Anything we should know?</h3>' +
          '<p class="sayhint">Your teacher reads this beside the flag it is about, and if that ' +
          'flag reaches the report your words are on it too. Say what happened — a calculator on ' +
          'the desk, the invigilator talking to you, a bad connection. Leave it empty to take it back.</p>' +
          [...me.said.entries()].map(([kind, note]) =>
            '<div class="sayrow" data-kind="'+esc(kind)+'"><span class="sk">'+esc(label(kind))+'</span>' +
            '<span class="sv'+(note?'':' none')+'">'+(note ? esc(note.body) : 'Say what happened') +
            '</span></div>').join("") + '</div>'
        : '';
      // me.name, not me.p.name, rendered an empty heading: readExam returns the
      // participant row under `p`, and esc(undefined) is "" rather than a crash, so
      // the student's own name has quietly been blank here.
      $("out").innerHTML = '<div class="student"><h2><span class="n">'+esc(me.p.name)+'</span>'+setup+
        '<span class="ct">'+evs.length+' flag'+(evs.length===1?"":"s")+'</span></h2>'+
        '<div class="chips">'+chips+'</div>'+(eps.length?narrative(eps):'')+
        (eps.length ? '<div class="eps">'+eps.map(epHtml).join("")+'</div>' : '')+say+'</div>';
      myPid = me.p.id;
    }

    // Click a line, type, blur. maxlength matches the 400 the database enforces, so
    // the limit is felt while typing rather than reported as a failure afterwards.
    let myPid = null, editingSay = null;
    document.addEventListener("click", e => {
      const row = e.target.closest(".sayrow"); if (!row || editingSay || teacher) return;
      const val = row.querySelector(".sv"), kind = row.getAttribute("data-kind");
      const current = val.classList.contains("none") ? "" : val.textContent.trim();
      editingSay = row;
      val.innerHTML = '<textarea maxlength="400" placeholder="Say what happened"></textarea>';
      const ta = val.querySelector("textarea");
      ta.value = current; ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
      const done = async () => {
        const body = ta.value.trim(); editingSay = null;
        if (body !== current) await saveSaid(kind, body);
        await fetchAndDraw();
      };
      ta.addEventListener("blur", done, { once: true });
      ta.addEventListener("keydown", ev => {
        if (ev.key === "Escape") { ta.removeEventListener("blur", done); editingSay = null; fetchAndDraw(); }
        if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) ta.blur();
      });
    });
    async function saveSaid(kind, body) {
      if (!myPid) return;
      // Clearing it withdraws it. Someone who thinks better of what they wrote
      // should not be held to a first draft — these are their own words, not
      // evidence about them, which is why v14 grants this one delete.
      if (!body) {
        await sb.from("finding_notes").delete()
          .eq("participant_id", myPid).eq("kind", kind).eq("author", "student");
        return;
      }
      const { error } = await sb.from("finding_notes")
        .upsert({ exam_id: examId, participant_id: myPid, kind, author: "student", body },
                { onConflict: "participant_id,kind,author" });
      if (error) $("out").insertAdjacentHTML("afterbegin",
        '<div class="empty">That could not be saved. Try again in a moment.</div>');
    }

    async function fetchEvents() {
      // prefer the reviewable shape (needs the v6 column); fall back so the report works pre-migration
      let q = await sb.from("events").select("id,participant_id,kind,severity,at,review,meta").eq("exam_id", examId).order("at",{ascending:true});
      if (q.error) { reviewEnabled = false;
        q = await sb.from("events").select("participant_id,kind,severity,at,meta").eq("exam_id", examId).order("at",{ascending:true}); }
      else { reviewEnabled = teacher; }
      return q.data || [];
    }
    // finding notes need v14. An error means the migration isn't in yet, and both
    // the student's "say what happened" and the teacher's outcome simply don't appear.
    async function fetchFindingNotes() {
      const q = await sb.from("finding_notes").select("participant_id,kind,author,body,at").eq("exam_id", examId);
      notesOn = !q.error;
      findingNotes = q.data || [];
      return findingNotes;
    }
    async function fetchAndDraw() {
      // RLS scopes these; a student view also narrows to their own row (covers an owner who joined)
      // last_seen closes the student's monitored window. Without it every window ran to
      // the last event or to now, so the ambient RATE — and therefore the score — came
      // out different here than on the findings document, for the same student.
      let pq = sb.from("participants").select("id,name,status,joined_at,last_seen").eq("exam_id", examId);
      if (!teacher && user) pq = pq.eq("user_id", user.id);
      const [{ data:parts }, events, ns, fn] = await Promise.all([ pq, fetchEvents(), fetchNotes(), fetchFindingNotes() ]);
      notes = ns;
      draw(parts, events);
    }

    (async () => {
      const { data:{ user:u } } = await sb.auth.getUser();
      if (!u || !examId) { location.replace("/exam/"); return; }
      user = u;
      const e = await fetchExam(examId, "title,code,status,created_at,closed_at,starts_at,ends_at,owner");
      exam = e;
      if (exam) useTimezone(exam.timezone);
      // Role by CONTEXT first (how you got here), then ownership. The room opens activity
      // with ?as=student and remembers vg_role=student, so the exam's OWNER who joined their
      // own room stays in the student view — 'back' returns to the room, never the console.
      const asParam = new URLSearchParams(location.search).get("as");
      const actingStudent = asParam === "student"
        || (asParam !== "teacher" && localStorage.getItem("vg_role") === "student");
      teacher = !actingStudent && !!exam && exam.owner === user.id;
      const open = !!exam && exam.status === "open";

      if (teacher) { $("back").href = "/exam/console.html"; }
      else { $("back").href = open ? "/exam/room.html?e=" + examId : "/exam/"; $("histLink").style.display = ""; }

      $("title").textContent = teacher ? "Exam report" : "Your activity";
      if (exam){ $("sub").textContent = exam.title + " · code " + exam.code + " · " + exam.status;
        document.title = "Vigil · " + exam.title; }
      $("gen").textContent = ["Generated " + new Date().toLocaleDateString() + " " + clockSec(Date.now()), tzNote()]
        .filter(Boolean).join(" · ");
      if (open) $("livePill").style.display = "";

      if (teacher){
        $("csvBtn").style.display=""; $("pdfBtn").style.display="";
        $("csvBtn").onclick = () => {
          const csv = "Student,Event,Count,Start,End,Review\n" + csvRows.map(r => r.map(x => '"'+String(x).replace(/"/g,'""')+'"').join(",")).join("\n");
          const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
          a.download = (exam?exam.title:"exam") + "-report.csv"; a.click();
        };
        // the one-page findings document is what gets signed and filed; this page
        // stays as the full underlying record (and still prints, via the browser)
        $("pdfBtn").href = "/exam/findings.html?e=" + examId;
        // Confirm / Dismiss a whole EPISODE (delegation survives redraws — #out stays put)
        $("out").addEventListener("click", async (e) => {
          const b = e.target.closest(".rb"); if (!b) return;
          const row = b.closest(".eprow"); if (row) curKey = row.getAttribute("data-key");
          const val = b.classList.contains("on") ? null : (b.getAttribute("data-act") === "confirm" ? "confirmed" : "dismissed");
          await applyReview(b.getAttribute("data-ids").split(","), val, b);
        });
        // keyboard triage: arrows move, C confirms, X dismisses the highlighted episode
        document.addEventListener("keydown", async (e) => {
          if (e.metaKey || e.ctrlKey || e.altKey) return;
          const rows = cursorRows(); if (!rows.length) return;
          const k = e.key.toLowerCase();
          let i = rows.findIndex(r => r.classList.contains("cur"));
          if (k === "arrowdown" || k === "j") { e.preventDefault(); setCur(rows, Math.min(rows.length-1, i+1)); }
          else if (k === "arrowup" || k === "k") { e.preventDefault(); setCur(rows, Math.max(0, i-1)); }
          else if ((k === "c" || k === "x") && i >= 0) {
            e.preventDefault();
            const btn = rows[i].querySelector(k === "c" ? ".rb.ok" : ".rb.no"); if (!btn) return;
            const val = btn.classList.contains("on") ? null : (k === "c" ? "confirmed" : "dismissed");
            const next = rows[i+1]; curKey = next ? next.getAttribute("data-key") : rows[i].getAttribute("data-key");
            await applyReview(btn.getAttribute("data-ids").split(","), val, btn);
          }
        });
      }

      await fetchAndDraw();

      // LIVE: while the exam is open, new events + status changes stream straight in
      // whatever is on screen is current — no going back and forth to refresh
      setInterval(fetchAndDraw, 5000);
      addEventListener("visibilitychange", () => { if (!document.hidden) fetchAndDraw(); });
      if (open){
        let t; const deb = () => { clearTimeout(t); t = setTimeout(fetchAndDraw, 600); };
        sb.channel("report-"+examId)
          .on("postgres_changes", { event:"*", schema:"public", table:"events", filter:"exam_id=eq."+examId }, deb)
          .on("postgres_changes", { event:"*", schema:"public", table:"participants", filter:"exam_id=eq."+examId }, deb)
          .on("postgres_changes", { event:"UPDATE", schema:"public", table:"exams", filter:"id=eq."+examId },
            (p) => { if (p.new && p.new.status){ $("livePill").style.display = p.new.status === "open" ? "" : "none";
              if (exam){ exam.status = p.new.status; $("sub").textContent = exam.title + " · code " + exam.code + " · " + exam.status; } } })
          .subscribe();
        if (notesEnabled)
          sb.channel("notes-"+examId)
            .on("postgres_changes", { event:"*", schema:"public", table:"exam_notes", filter:"exam_id=eq."+examId }, deb)
            .subscribe();
        const poll = setInterval(async () => {
          const { data } = await sb.from("exams").select("status").eq("id", examId).maybeSingle();
          if (data && data.status !== "open"){ $("livePill").style.display = "none"; clearInterval(poll); }
        }, 15000);
      }

      // make sure PDF/print shows everything, then restore the tidy view. The
      // chosen band is dropped too: this page IS the full record, and printing
      // it with ten of a hundred students on it would be a record of nothing.
      addEventListener("beforeprint", () => {
        if (bandFilter) { bandFilter = null; drawChart(); }
        document.querySelectorAll("details").forEach(d => { d.dataset.o = d.open?"1":""; d.open = true; });
      });
      addEventListener("afterprint", () => document.querySelectorAll("details").forEach(d => { d.open = d.dataset.o==="1"; }));
    })();
  </script>
</body>
</html>
