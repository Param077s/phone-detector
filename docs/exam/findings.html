<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vigil · Exam integrity report</title>
  <link rel="icon" href="/favicon.svg">
  <meta name="theme-color" content="#f3f2ef">
  <link rel="stylesheet" href="/exam/style.css">
  <style>
    /* ── the document ─────────────────────────────────────────────────────
       Read once, decide, sign, file. Its unit is the MOMENT, not the student:
       a room-wide moment sits beside a phone as an equal. Every finding is two
       lines — a headline and one grey line of context — and per-episode timings
       live on an appendix page most readers will never turn to. */
    :root{ --voice:ui-serif,Georgia,"Times New Roman",serif }
    body{background:var(--bg)}
    .sheet{max-width:720px;margin:0 auto;padding:34px 26px 70px}

    .tools{display:flex;align-items:center;gap:10px;margin-bottom:30px}
    .tools .sp{flex:1}
    .opt{font-size:12.5px;color:var(--muted);font-weight:600;display:inline-flex;align-items:center;gap:6px;
      cursor:pointer;user-select:none;white-space:nowrap}
    .opt input{accent-color:var(--ink);width:14px;height:14px}
    /* Room / Document — the second one IS the download, shown before you take it */
    .views{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px}
    .views button{border:0;background:none;border-radius:999px;padding:6px 14px;cursor:pointer;
      font:600 12.5px var(--font);color:var(--muted);transition:background .18s,color .18s}
    .views button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow-sm)}
    .views button:hover:not(.on){color:var(--ink)}
    .backlink{color:var(--muted);display:inline-flex;align-items:center}
    .backlink svg{width:17px;height:17px} .backlink:hover{color:var(--ink)}

    /* letterhead */
    .letter{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--ink)}
    .letter .mk{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--ink);flex:0 0 auto}
    .letter .mk svg{width:15px;height:15px}
    .letter b{font-family:var(--display);font-size:15px;font-weight:700}
    .letter .sp{flex:1}
    .letter .kind{font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

    h1{font-size:27px;font-weight:500;letter-spacing:-.02em;margin:30px 0 6px}
    .context{font-size:13.5px;color:var(--muted)}
    .stand{font-family:var(--voice);font-size:19px;line-height:1.5;margin:30px 0 34px}
    .stand .rest{color:var(--muted)}

    /* findings — exactly two lines each */
    .finding{margin-bottom:32px;break-inside:avoid;page-break-inside:avoid}
    .fl1{display:flex;align-items:baseline;gap:12px}
    .fl1 .n{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums;flex:0 0 auto}
    .fl1 .h{font-size:17px;font-weight:500;flex:1;letter-spacing:-.01em}
    .fl2{font-size:14px;color:var(--muted);margin:5px 0 0 30px}
    /* what the two of them said. Serif, because it is the only speech on the page —
       everything above it is the machine's account, and these are people's words. */
    .said{font-family:var(--voice);font-size:14.5px;color:var(--ink);margin:9px 0 0 30px;
      padding-left:11px;border-left:2px solid var(--line);line-height:1.45}
    .said .by{font-family:var(--font);font-size:12px;color:var(--faint);white-space:nowrap}
    .outcome{font-size:13.5px;color:var(--muted);margin:8px 0 0 30px;line-height:1.45}
    .outcome .lb{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
      color:var(--faint);margin-right:7px}

    .chip{flex:0 0 auto;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;
      border:1px solid var(--line);background:var(--soft);color:var(--muted);cursor:pointer;
      font-family:var(--font);transition:border-color .16s,color .16s}
    .chip.upheld{background:var(--alert-soft);border-color:#f3c9ca;color:var(--alert)}
    .chip.aside{background:var(--soft);border-color:var(--line);color:var(--muted)}
    .chip.discuss{background:var(--warn-soft);border-color:#f0dcb6;color:var(--warn)}
    .chip.none{background:none;border-style:dashed;border-color:var(--line-strong);color:var(--faint)}
    .chip:hover{border-color:var(--ink);color:var(--ink)}
    .chip[disabled]{cursor:default;pointer-events:none}

    /* verdict picker — screen only; the document itself never shows controls */
    .pick{position:fixed;z-index:120;background:var(--card);border:1px solid var(--line);border-radius:12px;
      box-shadow:var(--shadow);padding:5px;display:none;min-width:132px}
    .pick.on{display:block}
    .pick button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;
      padding:8px 10px;font:500 13.5px var(--font);color:var(--ink);cursor:pointer}
    .pick button:hover{background:var(--soft)}
    .pick button.clear{color:var(--faint)}

    /* the room, coloured by risk — green clear, amber flagged, red serious */
    .presence{font-size:13.5px;color:var(--muted);margin:28px 0 10px}
    .room{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:0}
    .rtile .rn .pd{display:inline-block;width:7px;height:7px;border-radius:50%;corner-shape:round;background:var(--faint);
      margin-right:7px;vertical-align:.08em;transition:background .4s}
    .rtile .rn .pd.up{background:var(--ok)}
    .rtile.gone{opacity:.5}
    .rtile.off{display:none}   /* filtered out by the chart above */
    .rtile{background:var(--card);border:1.5px solid transparent;border-radius:10px;padding:14px 12px;
      text-align:left;font:inherit;width:100%;cursor:pointer;
      transition:transform .18s var(--spring),border-color .25s}
    .rtile:hover{transform:translateY(-2px)}
    .rtile:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
    .rtile .rn{display:block;font-size:14px;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .rtile .rs{display:block;font-size:12.5px;margin-top:4px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .rtile.quiet{border-color:rgba(31,157,99,.45)} .rtile.quiet .rs{color:var(--ok)}
    /* never sent a calibration record — we have no evidence either way, and that
       must not look like a clean result */
    .rtile.unver{border-style:dashed;border-color:var(--line-strong)} .rtile.unver .rs{color:var(--muted)}
    .rtile.warn{border-color:var(--warn)} .rtile.warn .rs{color:#854f0b}
    .rtile.alert,.rtile.serious{border-color:var(--alert)} .rtile.alert .rs,.rtile.serious .rs{color:#a32d2d}
    .roomline{display:flex;align-items:baseline;gap:10px;margin-top:22px;font-size:13.5px;color:var(--muted)}
    .roomline .see{background:none;border:0;padding:0;font:600 13.5px var(--font);color:var(--ink);cursor:pointer;border-bottom:1px solid var(--line-strong)}
    .roomline .see:hover{border-color:var(--ink)}

    /* the tile becomes the popup — the same movement as the live room */
    .scrim{position:fixed;inset:0;z-index:100;background:rgba(243,242,239,.72);opacity:0;
      transition:opacity .28s ease;pointer-events:none;display:none}
    .scrim.on{opacity:1;pointer-events:auto}
    .popWrap{position:fixed;inset:0;z-index:101;display:none;place-items:center;padding:22px;pointer-events:none}
    .popWrap.on{display:grid}
    .pop{width:min(420px,100%);max-height:80vh;overflow-y:auto;background:var(--card);border-radius:16px;
      padding:22px 22px 18px;box-shadow:var(--shadow);transform-origin:0 0;pointer-events:auto;will-change:transform}
    .popIn{transition:opacity .2s ease}
    .pop .ptop{display:flex;align-items:center;gap:10px}
    .pop .ptop .dot{width:9px;height:9px;border-radius:50%;corner-shape:round;background:var(--ok);flex:0 0 auto}
    .pop .ptop .dot.warn{background:var(--warn)} .pop .ptop .dot.alert{background:var(--alert)}
    .pop h2{font-size:21px;font-weight:500;letter-spacing:-.02em;margin:0}
    .pop .pstat{font-size:13.5px;color:var(--muted);margin:5px 0 0}
    .pop .lab{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:20px 0 8px}
    .pop .row{display:flex;gap:12px;font-size:13.5px;padding:4px 0;align-items:baseline}
    .pop .row .t{color:var(--faint);min-width:86px;font-variant-numeric:tabular-nums}
    .pop .row .w{color:var(--ink-2);flex:1}
    .pop .row.alert .w{color:#a32d2d}
    .pop .fnd{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
    .pop .fnd .fh{flex:1;font-size:14px;font-weight:500}
    .pop .psaid{font-family:var(--voice);font-size:13.5px;color:var(--ink-2);line-height:1.45;
      padding:0 0 6px 11px;border-left:2px solid var(--line);margin:2px 0 0}
    .pop .psaid .by{font-family:var(--font);font-size:11.5px;color:var(--faint)}
    .pop .pout{font-size:13px;color:var(--ink-2);line-height:1.45;padding:5px 0 9px}
    .pop .pout .lb{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
      color:var(--faint);margin-right:7px}
    .pop .pout[data-outcome]{cursor:text;border-radius:5px;margin:0 -6px;padding:5px 6px 9px}
    .pop .pout[data-outcome]:hover{background:var(--soft)}
    .pop .pout.empty{color:var(--faint)}
    .pop .pout textarea{width:100%;font:inherit;font-size:13px;color:var(--ink);background:#fff;
      border:1px solid var(--line);border-radius:6px;padding:7px 8px;resize:vertical;min-height:56px;margin-top:5px}
    .pop .caveat{font-size:12.5px;color:var(--warn);margin-top:14px}
    .pop .who{font-size:13.5px;color:var(--ink-2);line-height:1.6;margin:0}

    /* the rest, in brief — one line each, keeping the number it has above so the
       brief list and the full record are talking about the same finding */
    #body .chart{margin:0 0 36px}
    .brief{margin:40px 0 0;padding-top:18px;border-top:1px solid var(--line)}
    .brief .lab{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
      color:var(--faint);display:block;margin-bottom:11px}
    .bl{display:flex;align-items:baseline;gap:10px;font-size:13.5px;padding:5px 0;break-inside:avoid}
    .bl .n{color:var(--faint);font-variant-numeric:tabular-nums;flex:0 0 auto}
    .bl .h{flex:1 1 auto}
    .bl .w{color:var(--muted);flex:0 0 auto}
    .bl .t{color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto}
    .bn{font-size:12.5px;color:var(--faint);margin-top:12px;line-height:1.5}
    @media(max-width:560px){ .bl{flex-wrap:wrap} .bl .h{flex:1 0 100%} }

    .none-yet{font-family:var(--voice);font-size:19px;color:var(--muted);margin:30px 0 34px}
    .clearlist{font-size:13.5px;color:var(--muted);margin:38px 0 0;line-height:1.6}
    .clearlist .lab{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:5px;font-family:var(--font)}

    .privacy{font-family:var(--voice);font-size:13.5px;color:var(--muted);margin:44px 0 0;padding-bottom:16px;border-bottom:1px solid var(--line)}
    .sign{display:flex;gap:26px;margin-top:52px}
    .sign span{flex:1;border-top:1px solid var(--ink);padding-top:6px;
      font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

    /* appendix — the detail, deliberately on its own page */
    .appendix{margin-top:64px;padding-top:22px;border-top:1px solid var(--line)}
    .appendix h2{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 18px}
    .apx{margin-bottom:20px;break-inside:avoid}
    .apx .t{font-size:13.5px;font-weight:500;margin-bottom:4px}
    .apx .t .n{color:var(--faint);font-variant-numeric:tabular-nums;margin-right:8px;font-weight:400}
    .apx .e{font-size:13px;color:var(--muted);display:flex;gap:12px;padding:2px 0 2px 30px}
    .apx .e .w{min-width:118px;font-variant-numeric:tabular-nums}
    .msg{font-size:13px;color:var(--warn);margin-top:8px}
    .loading{color:var(--muted);padding:40px 0}

    /* On screen the room is the working surface and the document is what prints.
       "Document" swaps them, so what you are looking at is exactly what Download
       gives you — previewing an export by exporting it is not a preview. */
    #body{display:none}
    body.showdoc .screenonly{display:none}
    body.showdoc #body{display:block}
    body.showdoc .sheet{padding-bottom:90px}
    @media(max-width:860px){ .room{grid-template-columns:repeat(3,minmax(0,1fr))} }
    @media(max-width:560px){ .room{grid-template-columns:repeat(2,minmax(0,1fr))} }
    @media(prefers-reduced-motion:reduce){ .pop,.popIn,.rtile{transition-duration:.01ms !important} }
    @media print{
      @page{ margin:16mm }
      body{background:#fff;background-image:none}
      body::before{display:none}
      .sheet{max-width:none;padding:0}
      #body{display:block}
      .screenonly,.scrim,.popWrap{display:none !important}
      .tools,.pick,.msg{display:none !important}
      .chip{cursor:default}
      .chip.none{display:none}   /* no chip is the honest mark for "not reviewed" */
      .appendix{page-break-before:always;margin-top:0;border-top:0;padding-top:0}
      *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="tools">
      <a class="backlink" id="back" href="/exam/console.html" aria-label="Back"><svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <span class="sp"></span>
      <div class="views" role="tablist" aria-label="View">
        <button type="button" id="vRoom" class="on" role="tab" aria-selected="true">Room</button>
        <button type="button" id="vDoc" role="tab" aria-selected="false">Document</button>
      </div>
      <label class="opt" title="By default the download carries the serious findings in full and the rest in one line each."><input type="checkbox" id="fullDoc"> Every finding</label>
      <a class="btn ghost sm" id="fullLink" href="#">Full record</a>
      <button class="btn ink sm" id="dl" type="button">Download</button>
    </div>

    <div class="letter">
      <span class="mk"><svg viewBox="0 0 24 24" fill="none"><path d="M6 10V7.5A1.5 1.5 0 0 1 7.5 6H10M14 6h2.5A1.5 1.5 0 0 1 18 7.5V10M18 14v2.5a1.5 1.5 0 0 1-1.5 1.5H14M10 18H7.5A1.5 1.5 0 0 1 6 16.5V14" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="2.6" fill="#fff"/></svg></span>
      <b>Vigil</b><span class="sp"></span><span class="kind">Exam integrity report</span>
    </div>

    <h1 id="title">Exam</h1>
    <div class="context" id="context"></div>

    <!-- screen: the room, read afterwards. print: hidden, the document takes over -->
    <div class="screenonly">
      <div class="chart" id="chart" style="display:none;margin-top:26px"></div>
      <div class="presence" id="presence"></div>
      <div class="room" id="room"></div>
      <div class="roomline hidden" id="roomline"><span id="roomtxt"></span><button class="see" id="roomsee" type="button">See it</button></div>
    </div>

    <div id="body"><div class="loading">Reading the exam…</div></div>
  </div>

  <div class="pick" id="pick" role="menu"></div>
  <div class="scrim" id="scrim"></div>
  <div class="popWrap" id="popWrap" aria-hidden="true">
    <div class="pop" id="pop" role="dialog" aria-modal="true" aria-labelledby="popName"><div class="popIn" id="popIn"></div></div>
  </div>

  <script type="module">
    import { sb, fetchExam, selectAll, orderedEvents } from "/exam/sb.js";
    import { esc, label, clock, clockRange, dateLong, word, readExam, spanTxt, roomHeadline, isOnline, ago,
             examWindow, examOver, useTimezone, tzNote,
             RISK_BANDS, bandCounts, bandLabel, keyFinding, BAND_KEY } from "/exam/exam-core.js";
    const $ = id => document.getElementById(id);
    const examId = new URLSearchParams(location.search).get("e");

    const VERDICT = { confirmed: ["Upheld", "upheld"], dismissed: ["Set aside", "aside"], discuss: ["To discuss", "discuss"] };
    let exam = null, read = null, canReview = false;
    let notes = [], notesOn = false;   // finding notes, and whether v14 is applied

    // ── the page ────────────────────────────────────────────────────────────
    // How much of this a person has stood behind. A signature at the bottom of a
    // document nobody has read means something different from one at the bottom of
    // a document read end to end and agreed with, and until now the page looked
    // identical either way.
    function reviewSentence(rv) {
      if (!rv.total) return "";
      if (rv.unread === rv.total) return "None reviewed yet.";
      const parts = [];
      if (rv.upheld) parts.push(word(rv.upheld).toLowerCase() + " upheld");
      if (rv.aside) parts.push(word(rv.aside).toLowerCase() + " set aside");
      if (rv.discuss) parts.push(word(rv.discuss).toLowerCase() + " to discuss");
      if (rv.unread) parts.push(word(rv.unread).toLowerCase() + " still to review");
      const last = parts.pop();
      const s = parts.length ? parts.join(", ") + " and " + last : last;
      return s.charAt(0).toUpperCase() + s.slice(1) + ".";
    }

    // ── the class at a glance ────────────────────────────────────────────────
    // The same bar on both surfaces: on screen it filters the room below it, on
    // paper it is the figure at the head of the document. The counts come from
    // the shared core, so the bar and the tiles under it cannot disagree about
    // the same room. On paper the markup drops everything that would imply you
    // could press it.
    let bandFilter = null;
    function chartHtml(interactive) {
      const counts = bandCounts(read.students), total = read.students.length;
      if (!total) return "";
      if (interactive && bandFilter && !counts[bandFilter]) bandFilter = null;
      const bands = RISK_BANDS.filter(b => b.always || counts[b.key] > 0);
      const max = Math.max(1, ...bands.map(b => counts[b.key]));
      const bar = b => {
        const inner = '<span class="bn">' + counts[b.key] + '</span>' +
          '<span class="bplot"><span class="bbar ' + b.key + '" style="height:' +
            Math.round(counts[b.key] / max * 100) + '%"></span></span>' +
          '<span class="blab">' + b.short + '</span>';
        return interactive
          ? '<button type="button" class="bcol' + (bandFilter === b.key ? " sel" : "") + '" data-band="' + b.key +
            '" aria-pressed="' + (bandFilter === b.key) + '" aria-label="' + counts[b.key] + ' ' + b.label + '">' +
            inner + '</button>'
          : '<span class="bcol">' + inner + '</span>';
      };
      // On screen: how to use it. On paper: what the four words mean, because
      // the reader of a filed document is often not the person who ran the exam.
      const foot = interactive
        ? '<span class="chint">' + (bandFilter
            ? "showing " + bandLabel(bandFilter) + " — press again for the whole room"
            : total + " student" + (total === 1 ? "" : "s") + " · press a bar to see only those") + '</span>'
        : '<p class="bkey">' + BAND_KEY + '</p>';
      return '<div class="bars">' + bands.map(bar).join("") + '</div>' + foot;
    }
    // redrawn only when it would actually change — this page repaints every 2 s,
    // and replacing the bar each time would kill any hover mid-press
    let chartSig = null;
    function drawChart() {
      const html = chartHtml(true);
      if (html !== chartSig) {
        chartSig = html;
        $("chart").style.display = html ? "" : "none";
        $("chart").innerHTML = html;
      }
      $("chart").classList.toggle("on", !!bandFilter);
      for (const [, el] of rtiles)
        el.classList.toggle("off", !!bandFilter && el.dataset.band !== bandFilter);
    }
    $("chart").addEventListener("click", e => {
      const b = e.target.closest("[data-band]"); if (!b) return;
      const k = b.getAttribute("data-band");
      bandFilter = bandFilter === k ? null : k;
      drawChart();
    });

    function draw() {
      const all = read.findings, clear = read.clear;
      // WHAT THE DOWNLOAD CARRIES. Everything, in full, made a document that ran
      // to pages and was therefore filed unread — and a summary nobody reads is
      // worth less than a short one that is. So by default the serious findings
      // keep the full treatment and the rest are compressed to a line each, with
      // the line saying where the detail lives. "Every finding" restores the long
      // form for anyone who needs to print the lot.
      const full = $("fullDoc").checked;
      const f = full ? all : all.filter(keyFinding);
      const brief = full ? [] : all.filter(x => !keyFinding(x));
      const rev = reviewSentence(read.review);
      const stand = all.length
        ? '<span>' + word(all.length) + (all.length === 1 ? " finding." : " findings.") + '</span> ' +
          '<span class="rest">' + (rev ? esc(rev) + " " : "") +
          word(clear.length) + ' student' + (clear.length === 1 ? "" : "s") + ' finished clear.</span>'
        : "";

      // The student's own account of a finding, printed under it and attributed.
      // If this document ever reaches a hearing, the person it is about has been
      // heard in it — which is the only reason to have asked them.
      const saidHtml = x => x.said
        ? '<div class="said">“' + esc(x.said.body) + '” <span class="by">— ' + esc(x.who) + '</span></div>' : "";
      // and what the conversation concluded, which is where "To discuss" was leading
      const outcomeHtml = x => x.outcome
        ? '<div class="outcome"><span class="lb">Outcome</span> ' + esc(x.outcome.body) + '</div>' : "";

      const findingHtml = x =>
        '<div class="finding">' +
          '<div class="fl1"><span class="n">' + x.n + '</span><span class="h">' + esc(x.headline) + '</span>' + chipHtml(x) + '</div>' +
          '<div class="fl2">' + esc(x.who) + ' · ' + clock(x.startT) + ' · ' + x.count + ' flag' + (x.count === 1 ? "" : "s") +
            ' · ' + esc(x.quality) + '</div>' +
          saidHtml(x) + outcomeHtml(x) +
        '</div>';

      // the rest, one line each, keeping the number it carries in the full record
      // so the brief list and the record are talking about the same finding
      const briefHtml = list => list.length
        ? '<div class="brief"><span class="lab">' + (f.length ? "Also flagged" : "Findings, in brief") + '</span>' +
          list.map(x => '<div class="bl"><span class="n">' + x.n + '</span>' +
            '<span class="h">' + esc(x.headline) + '</span>' +
            '<span class="w">' + esc(x.who) + '</span>' +
            '<span class="t">' + clock(x.startT) + ' · ' + x.count + ' flag' + (x.count === 1 ? "" : "s") +
            (x.said ? ' · account on file' : '') + '</span></div>').join("") +
          '<p class="bn">' + (f.length ? "These sat below the serious bar and are given in brief. "
            : "None of these reached the serious bar. ") +
          'Every moment behind them, and anything the students wrote about them, is in the full record.</p></div>'
        : "";

      const body = all.length
        ? '<div class="stand">' + stand + '</div>' + '<div class="chart">' + chartHtml(false) + '</div>' +
          f.map(findingHtml).join("") + briefHtml(brief)
        : '<div class="none-yet">Nothing was flagged. ' +
          '<span class="rest">' + word(read.roster.length) + ' student' + (read.roster.length === 1 ? "" : "s") + ' finished clear.</span></div>' +
          '<div class="chart">' + chartHtml(false) + '</div>';

      const unver = read.unverified.length
        ? '<div class="clearlist"><span class="lab">No monitoring data</span>' +
          read.unverified.map(x => esc(x.p.name)).join(", ") +
          ' — these students never completed setup, so nothing was recorded about them ' +
          'either way. This is not a clear result.</div>' : "";
      const clearList = (all.length && clear.length)
        ? '<div class="clearlist"><span class="lab">Finished clear</span>' +
          clear.map(s => esc(s.p.name)).join(", ") + '</div>' : "";

      $("body").innerHTML = body + clearList + unver +
        '<p class="privacy">No video, audio or images left any student’s device. Every finding above is an on-device ' +
        'detection, offered as an aid to human judgement and not as a conclusion.</p>' +
        '<div class="sign"><span>Reviewed by</span><span>Signature</span><span>Date</span></div>' +
        appendixHtml(f) + '<div class="msg" id="msg"></div>';
      drawRoom();
    }

    // the document only needs rebuilding when the findings themselves change
    let docSig = null;
    function drawIfChanged() {
      const sig = read.findings.map(x => x.n + ":" + x.ids.length + ":" + (x.review || "-")).join("|") +
        "#" + read.clear.length + "#" + read.roster.length +
        // how much of it the download carries is part of what the document IS
        "#" + ($("fullDoc").checked ? "all" : "key");
      if (sig === docSig) { drawRoom(); return; }
      docSig = sig; draw();
    }

    // ── the room, read afterwards ───────────────────────────────────────────
    // Same tiles as the live room, but now they carry risk rather than presence:
    // green finished clear, amber was flagged, red flagged seriously. Press one and
    // it grows into that student's record. The document above is what Download
    // prints; on screen this is what a teacher actually works through.
    const rtiles = new Map();   // participant id -> tile element, kept across redraws
    function drawRoom() {
      const live = exam && exam.status === "open";
      // Online first while the exam runs — the teacher is watching this page during
      // it, and someone who has dropped out matters more than someone's flag count.
      const rows = read.students.slice().sort((a, b) =>
        (live ? (isOnline(b.p) ? 1 : 0) - (isOnline(a.p) ? 1 : 0) : 0) ||
        b.score - a.score || a.p.name.localeCompare(b.p.name));
      const on = rows.filter(x => isOnline(x.p)).length, off = rows.length - on;
      const ptxt = live
        ? on + " online" + (off ? " · " + off + " offline" : "") + " · " + rows.length + " joined"
        : rows.length + (rows.length === 1 ? " student joined" : " students joined");
      if ($("presence").textContent !== ptxt) $("presence").textContent = ptxt;

      // Reconcile — never rebuild. This page redraws every 2 s, and replacing the
      // grid's innerHTML each time destroyed thirty tiles, killed any hover, and
      // flickered the whole room. Same mistake the live room already learned.
      const room = $("room");
      for (const st of rows) {
        const up = isOnline(st.p);
        let el = rtiles.get(st.p.id);
        if (!el) {
          el = document.createElement("button");
          el.type = "button"; el.className = "rtile"; el.dataset.id = st.p.id;
          el.innerHTML = '<span class="rn"><i class="pd"></i><span class="nm"></span></span><span class="rs"></span>';
          rtiles.set(st.p.id, el); room.appendChild(el);
        }
        el.dataset.band = st.risk;   // what the chart above filters on
        el.classList.toggle("quiet", st.band === "quiet" && !st.unverified);
        el.classList.toggle("unver", !!st.unverified);
        el.classList.toggle("warn", st.band === "warn");
        el.classList.toggle("alert", st.band === "alert");
        el.classList.toggle("serious", !!st.serious);
        el.classList.toggle("gone", live && !up);
        const dot = el.querySelector(".pd");
        dot.style.display = live ? "" : "none";
        dot.classList.toggle("up", up);
        const nm = el.querySelector(".nm"); if (nm.textContent !== st.p.name) nm.textContent = st.p.name;
        const rs = el.querySelector(".rs");
        const txt = st.unverified ? "no data" : st.score === 0 ? "clear" : (st.phrase || "flagged");
        if (rs.textContent !== txt) rs.textContent = txt;
      }
      for (const [id, el] of rtiles) if (!rows.some(r => r.p.id === id)) { el.remove(); rtiles.delete(id); }
      let want = room.firstChild;
      for (const st of rows) { const el = rtiles.get(st.p.id); if (!el) continue;
        if (el !== want) room.insertBefore(el, want); else want = el.nextSibling; }

      drawChart();

      const m = read.moments.length ? read.moments[read.moments.length - 1] : null;
      $("roomline").classList.toggle("hidden", !m);
      if (m) {
        $("roomtxt").textContent = clock(m.startT) + " — " + roomHeadline(m.kind).toLowerCase() + ".";
        $("roomsee").onclick = () => openMoment(m, $("roomsee"));
      }
    }

    function chipHtml(x) {
      const v = VERDICT[x.review];
      const cls = v ? v[1] : "none";
      const txt = v ? v[0] : "Review";
      return '<button class="chip ' + cls + '" data-ids="' + x.ids.join(",") + '"' +
        (canReview && x.ids.length ? "" : " disabled") + '>' + txt + '</button>';
    }

    // per-episode timings live here, on their own page — most readers never turn to it
    function appendixHtml(f) {
      if (!f.length) return "";
      const rows = x => {
        const evs = x.events;
        const runs = [];
        for (const e of evs) {
          const t = new Date(e.at).getTime(), last = runs[runs.length - 1];
          if (last && t - last.end <= 90_000) { last.end = t; last.n++; } else runs.push({ start: t, end: t, n: 1 });
        }
        return runs.map(r => '<div class="e"><span class="w">' + clock(r.start) +
          (r.n > 1 ? "–" + clock(r.end) : "") + '</span><span>' + esc(label(x.kind)) +
          (r.n > 1 ? " · " + r.n + "× over " + spanTxt(r.start, r.end) : "") + '</span></div>').join("");
      };
      return '<div class="appendix"><h2>Appendix · every flagged moment</h2>' +
        f.map(x => '<div class="apx"><div class="t"><span class="n">' + x.n + '</span>' +
          esc(x.headline) + ' — ' + esc(x.who) + '</div>' + rows(x) + '</div>').join("") + '</div>';
    }

    // ── a tile grows into the record ────────────────────────────────────────
    let openFrom = null, closeTimer = null;
    function morphOpen(sourceEl) {
      const pop = $("pop"), inner = $("popIn"), wrap = $("popWrap");
      clearTimeout(closeTimer); closeTimer = null;
      wrap.classList.add("on"); wrap.setAttribute("aria-hidden", "false");
      $("scrim").style.display = "block";
      requestAnimationFrame(() => $("scrim").classList.add("on"));
      pop.style.transition = "none"; pop.style.transform = "none";
      inner.style.transition = "none"; inner.style.opacity = "1";
      const p = pop.getBoundingClientRect(), s = sourceEl.getBoundingClientRect();
      pop.style.transform = "translate(" + (s.left - p.left) + "px," + (s.top - p.top) + "px) scale(" +
        (s.width / p.width) + "," + (s.height / p.height) + ")";
      inner.style.opacity = "0";
      void pop.offsetWidth;
      pop.style.transition = "transform .34s cubic-bezier(.2,.7,.2,1)";
      inner.style.transition = "opacity .2s ease .08s";
      pop.style.transform = "none"; inner.style.opacity = "1";
      openFrom = sourceEl;
    }
    function morphClose() {
      const pop = $("pop"), inner = $("popIn"), wrap = $("popWrap");
      if (!wrap.classList.contains("on")) return;
      $("scrim").classList.remove("on");
      const src = openFrom && openFrom.isConnected ? openFrom : null;
      if (src) {
        const p = pop.getBoundingClientRect(), s = src.getBoundingClientRect();
        pop.style.transition = "transform .34s cubic-bezier(.2,.7,.2,1)";
        inner.style.transition = "opacity .16s ease"; inner.style.opacity = "0";
        pop.style.transform = "translate(" + (s.left - p.left) + "px," + (s.top - p.top) + "px) scale(" +
          (s.width / p.width) + "," + (s.height / p.height) + ")";
      }
      openFrom = null; openPid = null; openMom = null;
      clearTimeout(closeTimer);
      closeTimer = setTimeout(() => {
        closeTimer = null;
        wrap.classList.remove("on"); wrap.setAttribute("aria-hidden", "true");
        $("scrim").style.display = "none";
        pop.style.transition = "none"; pop.style.transform = "none";
      }, src ? 340 : 0);
    }
    $("scrim").onclick = morphClose;

    // what is open, so a verdict can refresh it in place instead of slamming it shut
    let openPid = null, openMom = null;
    function reopen() {
      if (openPid) { const t = $("room").querySelector('.rtile[data-id="' + CSS.escape(openPid) + '"]');
        if (t) { openFrom = t; } studentHtml(openPid); }
      else if (openMom) {
        const m = read.moments.find(x => x.kind === openMom.kind && x.startT === openMom.startT);
        if (m) { openMom = m; momentHtml(m); }
      }
    }

    function openStudent(pid, sourceEl) {
      if (!studentHtml(pid)) return;
      openPid = pid; openMom = null;
      morphOpen(sourceEl);
    }
    function presenceLine(s) {
      if (!exam || exam.status !== "open") return "";
      return isOnline(s.p) ? "Online · " : "Offline since " + ago(s.p.last_seen) + " · ";
    }
    // Where a conversation gets written down. It appears once a verdict has been
    // given — before that there is nothing to have concluded, and an empty box
    // against every finding would be exactly the chrome this document avoids.
    function outcomeFieldHtml(f) {
      if (!notesOn || !f.review) return f.outcome
        ? '<div class="pout"><span class="lb">Outcome</span> ' + esc(f.outcome.body) + '</div>' : "";
      const key = f.student.p.id + "|" + f.kind;
      return '<div class="pout' + (f.outcome ? "" : " empty") + '" data-outcome="' + esc(key) + '">' +
        '<span class="lb">Outcome</span> ' +
        (f.outcome ? esc(f.outcome.body) : "What did the conversation conclude?") + '</div>';
    }
    function studentHtml(pid) {
      const s = read.students.find(x => x.p.id === pid); if (!s) return false;
      const mine = read.findings.filter(f => !f.room && f.student && f.student.p.id === pid);
      const eps = s.episodes;
      const caveat = s.calib && s.calib.grade && s.calib.grade !== "solid"
        ? '<div class="caveat">Setup was ' + esc(s.calib.grade) +
          (s.calib.reasons && s.calib.reasons.length ? " — " + esc(s.calib.reasons[0]) : "") + ". Read these lightly.</div>" : "";
      $("popIn").innerHTML =
        '<div class="ptop"><span class="dot ' + (s.band === "quiet" ? "" : s.band) + '"></span>' +
        '<h2 id="popName">' + esc(s.p.name) + '</h2></div>' +
        '<p class="pstat">' + presenceLine(s) + (s.unverified ? "No monitoring data — setup never completed" : s.score === 0 ? "Finished clear" :
          s.live.length + " flag" + (s.live.length === 1 ? "" : "s") + " · " + esc(s.phrase)) + '</p>' +
        // the verdicts that belong to this student, decidable right here — and
        // beneath each, what they said about it and what the conversation concluded
        (mine.length ? '<div class="lab">Findings</div>' + mine.map(f =>
          '<div class="fnd"><span class="fh">' + esc(f.headline) + '</span>' + chipHtml(f) + '</div>' +
          (f.said ? '<div class="psaid">“' + esc(f.said.body) + '” <span class="by">— ' +
            esc(s.p.name) + ', ' + clock(f.said.at) + '</span></div>' : "") +
          outcomeFieldHtml(f)).join("") : "") +
        // A student may write against ANY kind they were flagged for, including ones
        // that never reached the findings bar. Those have no finding to sit under, and
        // words written to be read must not disappear because the machine scored them
        // low — the person had something to say about being flagged at all.
        (() => {
          const spare = [...s.said.entries()]
            .filter(([kind, note]) => note && !mine.some(f => f.kind === kind));
          return spare.length ? '<div class="lab">Also said</div>' + spare.map(([kind, note]) =>
            '<div class="psaid">“' + esc(note.body) + '” <span class="by">— on ' +
            esc(label(kind).toLowerCase()) + ', ' + clock(note.at) + '</span></div>').join("") : "";
        })() +
        (eps.length ? '<div class="lab">Every flag</div>' + eps.map(ep =>
          '<div class="row ' + (ep.alert ? "alert" : "") + '"><span class="t">' + clock(ep.startT) +
          (ep.count > 1 ? "–" + clock(ep.endT) : "") + '</span><span class="w">' + esc(label(ep.kind)) +
          (ep.count > 1 ? " · " + ep.count + "×" : "") + '</span></div>').join("")
          : '<div class="lab">Every flag</div><div class="row"><span class="w">Nothing was recorded.</span></div>') +
        caveat;
      return true;
    }

    function openMoment(m, sourceEl) {
      openMom = m; openPid = null;
      momentHtml(m);
      morphOpen(sourceEl);
    }
    function momentHtml(m) {
      const names = [...m.people].map(id => (read.students.find(s => s.p.id === id) || {}).p)
        .filter(Boolean).map(p => p.name);
      const f = read.findings.find(x => x.room && x.startT === m.startT && x.kind === m.kind);
      $("popIn").innerHTML =
        '<div class="ptop"><span class="dot warn"></span><h2 id="popName">' + esc(roomHeadline(m.kind)) + '</h2></div>' +
        '<p class="pstat">' + names.length + ' of ' + read.roster.length + ' students · ' + clock(m.startT) + '</p>' +
        (f ? '<div class="lab">Verdict</div><div class="fnd"><span class="fh">' + esc(f.headline) + '</span>' + chipHtml(f) + '</div>' : "") +
        '<div class="lab">Who</div><p class="who">' + names.map(esc).join(", ") + '</p>' +
        '<div class="caveat">A whole room flagging together is usually the room, not the students. ' +
        'Setting this aside clears it for all of them at once.</div>';
    }

    $("room").addEventListener("click", e => {
      const tile = e.target.closest(".rtile");
      if (tile && !e.target.closest(".chip")) openStudent(tile.getAttribute("data-id"), tile);
    });

    // ── verdicts: one press sets every event behind the finding ─────────────
    let pickFor = null;
    function openPick(chip) {
      pickFor = chip;
      const cur = chip.classList.contains("upheld") ? "confirmed"
        : chip.classList.contains("aside") ? "dismissed"
        : chip.classList.contains("discuss") ? "discuss" : null;
      $("pick").innerHTML = Object.entries(VERDICT)
        .map(([k, v]) => '<button data-v="' + k + '">' + v[0] + (k === cur ? " ·" : "") + '</button>').join("") +
        (cur ? '<button class="clear" data-v="">Not reviewed</button>' : "");
      const r = chip.getBoundingClientRect();
      $("pick").classList.add("on");
      const h = $("pick").offsetHeight;
      $("pick").style.top = Math.max(8, Math.min(innerHeight - h - 8, r.bottom + 6)) + "px";
      $("pick").style.left = Math.max(8, Math.min(innerWidth - 144, r.left)) + "px";
    }
    const closePick = () => { $("pick").classList.remove("on"); pickFor = null; };

    // ── the outcome of a conversation ───────────────────────────────────────
    // Click the line, type, blur. No Save button and no dialog: this is one
    // sentence written after talking to someone, not a form.
    let editingOutcome = null;
    function openOutcome(el) {
      if (editingOutcome) return;
      editingOutcome = el;
      const key = el.getAttribute("data-outcome");
      const current = el.classList.contains("empty") ? "" : el.textContent.replace(/^\s*Outcome\s*/i, "").trim();
      el.innerHTML = '<span class="lb">Outcome</span><textarea maxlength="400" ' +
        'placeholder="What did the conversation conclude?"></textarea>';
      const ta = el.querySelector("textarea");
      ta.value = current;
      ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
      const done = async () => {
        const body = ta.value.trim();
        editingOutcome = null;
        const [pid, kind] = key.split("|");
        if (body !== current) await saveOutcome(pid, kind, body);
        await load(true);
        if ($("popWrap").classList.contains("on")) reopen();
      };
      ta.addEventListener("blur", done, { once: true });
      ta.addEventListener("keydown", ev => {
        if (ev.key === "Escape") { ev.stopPropagation(); ta.removeEventListener("blur", done); editingOutcome = null; reopen(); }
        if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) ta.blur();
      });
    }
    async function saveOutcome(pid, kind, body) {
      // Empty means "there is no outcome after all" — the row goes rather than
      // sitting there as an empty quotation in a filed document.
      if (!body) {
        await sb.from("finding_notes").delete()
          .eq("participant_id", pid).eq("kind", kind).eq("author", "teacher");
        return;
      }
      const { error } = await sb.from("finding_notes")
        .upsert({ exam_id: examId, participant_id: pid, kind, author: "teacher", body },
                { onConflict: "participant_id,kind,author" });
      if (error) $("msg").textContent = "That outcome could not be saved.";
    }

    document.addEventListener("click", async e => {
      const out = e.target.closest(".pout[data-outcome]");
      if (out && !e.target.closest("textarea")) { e.stopPropagation(); openOutcome(out); return; }
      if (editingOutcome) return;                 // a blur is already committing it
      const chip = e.target.closest(".chip");
      if (chip) { e.stopPropagation(); (pickFor === chip ? closePick : () => openPick(chip))(); return; }
      const opt = e.target.closest(".pick button");
      if (!opt) { closePick(); return; }
      const ids = pickFor.getAttribute("data-ids").split(",").filter(Boolean);
      const val = opt.getAttribute("data-v") || null;
      closePick();
      const { error } = await sb.from("events").update({ review: val }).in("id", ids);
      if (error) {
        // 'discuss' needs migration v9; the other two have worked since v6
        $("msg").textContent = val === "discuss"
          ? "“To discuss” needs the latest database update (schema v9)."
          : "That verdict could not be saved.";
        return;
      }
      await load(true);
      if ($("popWrap").classList.contains("on")) reopen();
    });
    addEventListener("keydown", e => { if (e.key !== "Escape") return; if ($("pick").classList.contains("on")) closePick(); else morphClose(); });
    addEventListener("resize", closePick);

    // ── data ────────────────────────────────────────────────────────────────
    // Events are append-only, so after the first read we only ask for what is new.
    // Refetching every event in the exam every 2 s was fine for one student and
    // thousands of rows for a full class. A verdict set in ANOTHER tab is an UPDATE
    // rather than an insert, so a full read still happens every 30 s to catch those
    // (and immediately after this tab writes one).
    let evs = [], seenIds = new Set(), lastAt = null, fullAt = 0, loading = false;
    async function load(force) {
      if (loading) return; loading = true;
      try {
        const full = force || !lastAt || (Date.now() - fullAt > 30000);
        // Every read PAGES. PostgREST caps a select at its max-rows setting, and
        // the full re-read below asks for an exam's ENTIRE event log — so past a
        // certain class size this page was quietly dropping the tail of the
        // record it exists to be. A short document and a truncated one look
        // identical on screen, which is exactly the problem.
        const evQuery = cols => {
          let q = sb.from("events").select(cols).eq("exam_id", examId);
          if (!full) q = q.gt("at", lastAt);
          return orderedEvents(q);
        };
        const [pq, er, nq] = await Promise.all([
          selectAll(() => sb.from("participants").select("id,name,status,joined_at,last_seen")
            .eq("exam_id", examId).order("id", { ascending: true })),
          selectAll(() => evQuery("id,participant_id,kind,severity,at,meta,review")),
          // finding notes need v14 — an error here means the migration isn't in yet,
          // and the document simply carries no speech, exactly as it did before
          selectAll(() => sb.from("finding_notes").select("participant_id,kind,author,body,at")
            .eq("exam_id", examId).order("at", { ascending: true }).order("participant_id", { ascending: true })),
        ]);
        notesOn = !nq.error;
        notes = nq.data || [];
        if (er.error && full) {
          // pre-v6: no review column. Fall back once, and stay on full reads.
          const fb = await selectAll(() => orderedEvents(
            sb.from("events").select("participant_id,kind,severity,at,meta").eq("exam_id", examId)));
          canReview = false; evs = fb.data || []; seenIds = new Set(); fullAt = Date.now();
        } else if (!er.error) {
          canReview = true;
          if (full) { evs = er.data || []; seenIds = new Set(evs.map(e => e.id)); fullAt = Date.now(); }
          else for (const e of (er.data || [])) if (!seenIds.has(e.id)) { seenIds.add(e.id); evs.push(e); }
        }
        if (evs.length && evs[evs.length - 1].at) lastAt = evs[evs.length - 1].at;

        read = readExam(pq.data || [], evs, { startsAt: exam.starts_at, endsAt: exam.ends_at, notes });
        // the exam's own window once v12 is applied; created_at/closed_at before that
        const w = examWindow(exam);
        const from = w.startT || read.startT;
        const to = w.endT || read.endT || Date.now();
        $("title").textContent = exam.title;
        // A running exam has an end that HASN'T HAPPENED. Printing "11:00–13:00"
        // over an exam it is currently 11:20 in states a fact about the future as
        // though it were on the record; the document says it is still going instead.
        const span = examOver(exam) ? clockRange(from, to) : "from " + clock(from) + ", still running";
        $("context").textContent = [exam.code, dateLong(from), span,
          read.roster.length + " student" + (read.roster.length === 1 ? "" : "s"),
          tzNote(from)].filter(Boolean).join(" · ");
        drawIfChanged();
      } finally { loading = false; }
    }

    (async () => {
      const { data: { user } } = await sb.auth.getUser();
      if (!user || !examId) { location.replace("/exam/"); return; }
      const e = await fetchExam(examId, "title,code,status,owner,created_at,closed_at,starts_at,ends_at,duration_min");
      // the findings document is the teacher's record — a student reads their own activity instead
      if (!e || e.owner !== user.id) { location.replace("/exam/report.html?e=" + examId + "&as=student"); return; }
      exam = e;
      useTimezone(e.timezone);          // read this exam in the room's own hours
      document.title = "Vigil · " + e.title;
      $("fullLink").href = "/exam/report.html?e=" + examId;
      // remembered per teacher, not per exam: someone who wants the long form
      // wants it for their exams, and re-ticking it every time is the kind of
      // small tax that ends with the box never being ticked
      $("fullDoc").checked = localStorage.getItem("vg_fulldoc") === "1";
      $("fullDoc").onchange = () => {
        localStorage.setItem("vg_fulldoc", $("fullDoc").checked ? "1" : "");
        drawIfChanged();
        setView(true);   // you changed how much it carries — show what that looks like
      };
      // Room / Document. Ticking "Every finding" or pressing Download from the
      // Room view used to be an act of faith; this is the same page the printer
      // gets, so nothing about the export is a surprise.
      const setView = doc => {
        document.body.classList.toggle("showdoc", doc);
        $("vDoc").classList.toggle("on", doc); $("vRoom").classList.toggle("on", !doc);
        $("vDoc").setAttribute("aria-selected", String(doc));
        $("vRoom").setAttribute("aria-selected", String(!doc));
      };
      $("vRoom").onclick = () => setView(false);
      $("vDoc").onclick = () => setView(true);
      $("dl").onclick = () => window.print();
      await load();
      // 2 s while an exam is running: this page is what the teacher watches during
      // it, so presence has to be as current as the live room's
      setInterval(async () => {
        await load();
        if ($("popWrap").classList.contains("on")) reopen();
      }, 2000);
      addEventListener("visibilitychange", async () => {
        if (document.hidden) return;
        await load();
        if ($("popWrap").classList.contains("on")) reopen();
      });
    })();
  </script>
</body>
</html>
