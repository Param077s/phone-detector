<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vigil · Your exams</title>
  <link rel="icon" href="/favicon.svg">
  <meta name="theme-color" content="#f3f2ef">
  <link rel="stylesheet" href="/exam/style.css">
  <style>
    .wrap{max-width:820px;margin:0 auto;padding:0 22px 80px}
    .bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:15px 0;margin-bottom:8px;
      background:rgba(255,255,255,.7);backdrop-filter:blur(12px)}
    .bar .sp{flex:1} .who{color:var(--muted);font-size:13.5px} .who b{color:var(--ink);font-weight:600}
    h1{font-size:23px;margin:18px 0 2px} .sub{color:var(--muted);font-size:14px;margin:0 0 22px}
    .sec-h{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700;margin:24px 2px 12px}
    .row{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow-sm);
      display:flex;align-items:center;gap:14px}
    .row .meta{flex:1;min-width:0}
    .row .title{font-weight:600;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .row .info{color:var(--muted);font-size:12.5px;margin-top:2px}
    .row .acts{display:flex;gap:8px;flex-shrink:0}
    .empty{color:var(--muted);text-align:center;padding:34px 20px;border:1px dashed var(--line-strong);border-radius:var(--r)}
    .empty b{color:var(--ink);font-weight:600;display:block;margin-bottom:4px;font-family:var(--display)}
    .pill.mut{color:var(--muted)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <span class="brand"><span class="mk"><svg viewBox="0 0 24 24" fill="none"><path d="M6 10V7.5A1.5 1.5 0 0 1 7.5 6H10M14 6h2.5A1.5 1.5 0 0 1 18 7.5V10M18 14v2.5a1.5 1.5 0 0 1-1.5 1.5H14M10 18H7.5A1.5 1.5 0 0 1 6 16.5V14" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="2.6" fill="#fff"/></svg></span><b>Vigil</b><span class="tag">· Your exams</span></span>
      <span class="sp"></span>
      <span class="who" id="who"></span>
      <a class="btn ghost sm" href="/exam/">Join a new exam</a>
      <button class="btn ghost sm" id="signout" style="display:none">Sign out</button>
    </div>

    <h1>Your exams</h1>
    <p class="sub">Every exam you've run or taken, and the report for each.</p>
    <div id="owned"></div>
    <div id="taken"></div>
  </div>

  <script type="module">
    import { sb, esc } from "/exam/sb.js";
    const $ = id => document.getElementById(id);
    const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString([], { month:"short", day:"numeric", year:"numeric" }) : "";
    const statusPill = (s) => s === "open"
      ? '<span class="pill ok">Open</span>' : '<span class="pill mut">Ended</span>';

    (async () => {
      const { data:{ user } } = await sb.auth.getUser();
      if (!user) { location.replace("/exam/"); return; }
      const signedIn = !user.is_anonymous && !!user.email;
      if (signedIn) {
        $("who").innerHTML = "Signed in as <b>" + esc(user.email) + "</b>";
        $("signout").style.display = "";
        $("signout").onclick = async () => { await sb.auth.signOut(); localStorage.removeItem("vg_role"); location.href = "/exam/"; };
      }

      // ── exams you ran (owned) ──
      const { data:owned } = await sb.from("exams")
        .select("id,title,code,status,created_at").eq("owner", user.id).order("created_at",{ascending:false});
      if (owned && owned.length){
        $("owned").innerHTML = '<div class="sec-h">Exams you ran</div>' + owned.map(x =>
          '<div class="row"><div class="meta"><div class="title">'+esc(x.title)+'</div>'+
            '<div class="info">code '+esc(x.code)+' · '+fmtDate(x.created_at)+'</div></div>'+
            '<div class="acts">'+statusPill(x.status)+
              '<a class="btn ink sm" href="/exam/report.html?e='+encodeURIComponent(x.id)+'">Report</a>'+
              '<a class="btn ghost sm" href="/exam/live.html?e='+encodeURIComponent(x.id)+'">'+(x.status==="open"?"Live":"Who joined")+'</a>'+
            '</div></div>').join("");
      }

      // ── exams you took (joined as a student) ──
      const ownedIds = new Set((owned||[]).map(x => x.id));
      const { data:parts } = await sb.from("participants")
        .select("exam_id, joined_at, exams(id,title,code,status,created_at)")
        .eq("user_id", user.id).order("joined_at",{ascending:false});
      const taken = (parts||[]).map(p => p.exams).filter(e => e && !ownedIds.has(e.id));
      if (taken.length){
        $("taken").innerHTML = '<div class="sec-h">Exams you took</div>' + taken.map(x =>
          '<div class="row"><div class="meta"><div class="title">'+esc(x.title)+'</div>'+
            '<div class="info">code '+esc(x.code)+' · '+fmtDate(x.created_at)+'</div></div>'+
            '<div class="acts">'+statusPill(x.status)+
              (x.status==="open" ? '<a class="btn ink sm" href="/exam/room.html?e='+encodeURIComponent(x.id)+'">Rejoin</a>' : '')+
              '<a class="btn ghost sm" href="/exam/report.html?e='+encodeURIComponent(x.id)+'">Your activity</a>'+
            '</div></div>').join("");
      }

      if ((!owned || !owned.length) && !taken.length){
        $("taken").innerHTML = '<div class="empty"><b>Nothing yet</b>Exams you run or take will show up here.</div>';
      }
    })();
  </script>
</body>
</html>
