<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vigil · Exams</title>
  <link rel="icon" href="/favicon.svg">
  <meta name="theme-color" content="#f3f2ef">
  <link rel="stylesheet" href="/exam/style.css">
  <style>
    .card{width:100%;max-width:440px;padding:30px 28px;animation:rise .5s var(--spring) both}
    @keyframes rise{from{opacity:0;transform:translateY(12px) scale(.99)}}
    .top{display:flex;align-items:center;gap:10px;margin-bottom:22px}
    h1{font-size:22px;margin:0 0 6px} .lead{color:var(--muted);margin:0 0 20px;font-size:14px;line-height:1.55}
    .roles{display:flex;flex-direction:column;gap:12px}
    .role{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;background:#fff;
      border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:16px;
      transition:border-color .16s,transform .16s var(--spring),box-shadow .2s}
    .role:hover{border-color:var(--ink);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
    .role .ic{width:42px;height:42px;border-radius:11px;background:var(--ink);color:#fff;display:grid;place-items:center;flex:0 0 auto}
    .role .ic svg{width:22px;height:22px}
    .role .t{display:block;font-family:var(--display);font-weight:600;font-size:16px}
    .role .s{display:block;color:var(--muted);font-size:13px;margin-top:2px}
    .role .arw{margin-left:auto;color:var(--faint);transition:transform .2s var(--spring)}
    .role:hover .arw{transform:translateX(3px);color:var(--ink)}
    .back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;margin-bottom:14px}
    .back:hover{color:var(--ink)} .back svg{width:15px;height:15px}
    .tabs{display:flex;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:6px}
    .tabs button{flex:1;border:0;background:none;padding:9px;border-radius:999px;font:600 13.5px var(--font);color:var(--muted);cursor:pointer;transition:all .18s}
    .tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}
    #code{text-transform:uppercase;letter-spacing:4px;font-weight:600;text-align:center;font-size:20px}
    .orline{display:flex;align-items:center;gap:12px;margin:16px 0 4px;color:var(--faint);font-size:12px}
    .orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--line)}
    #googleBtn{gap:10px;margin-top:16px} #googleBtn svg{width:18px;height:18px}
    #sGoogle svg{width:18px;height:18px}
    .who2{color:var(--muted);font-size:12.5px;margin-top:9px} .who2 a{color:var(--ink);font-weight:600;cursor:pointer;text-decoration:underline}
    #guestJoin{cursor:pointer;margin-top:2px !important}
  </style>
</head>
<body>
  <div class="center">
    <div class="card">
      <div class="top brand"><span class="mk"><svg viewBox="0 0 24 24" fill="none"><path d="M6 10V7.5A1.5 1.5 0 0 1 7.5 6H10M14 6h2.5A1.5 1.5 0 0 1 18 7.5V10M18 14v2.5a1.5 1.5 0 0 1-1.5 1.5H14M10 18H7.5A1.5 1.5 0 0 1 6 16.5V14" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="2.6" fill="#fff"/></svg></span><b>Vigil</b><span class="tag">· Exams</span></div>

      <!-- role -->
      <section id="s-role">
        <h1>Who's joining?</h1>
        <p class="lead">Students join with a code. Teachers run the room.</p>
        <div class="roles">
          <button class="role" id="pickStudent" type="button">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="#fff" stroke-width="1.7"/><path d="M5.5 19a6.5 6.5 0 0 1 13 0" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg></span>
            <span><span class="t">I'm a student</span><span class="s">Join an exam with your code</span></span>
            <span class="arw"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          </button>
          <button class="role" id="pickTeacher" type="button">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="12" rx="2" stroke="#fff" stroke-width="1.7"/><path d="M8 20h8" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg></span>
            <span><span class="t">I'm a teacher</span><span class="s">Create rooms & watch presence</span></span>
            <span class="arw"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          </button>
        </div>
      </section>

      <!-- student join -->
      <section id="s-student" class="hidden">
        <span class="back" data-back><svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</span>
        <h1>Join your exam</h1>
        <p class="lead">Enter the code from your invigilator. Sign in with Google so your results are saved to you.</p>
        <label class="label" for="code">Exam code</label>
        <input class="input" id="code" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC123">
        <label class="label" for="sname">Your name</label>
        <input class="input" id="sname" autocomplete="name" placeholder="e.g. Priya Sharma">
        <div class="who2 hidden" id="sWho"></div>
        <button class="btn primary block" id="joinBtn" style="margin-top:16px;display:none">Join exam</button>
        <button class="btn ghost block" id="sGoogle" type="button" style="margin-top:16px;gap:10px">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1Z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23Z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84Z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06L5.84 9.9C6.71 7.31 9.14 5.38 12 5.38Z"/></svg>
          Continue with Google
        </button>
        <div class="orline" id="guestOr">or</div>
        <a class="back" id="guestJoin" style="justify-content:center;margin:0">Join as a guest instead</a>
        <div class="err" id="sErr"></div>
      </section>

      <!-- teacher auth -->
      <section id="s-teacher" class="hidden">
        <span class="back" data-back><svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</span>
        <h1 id="tHead">Teacher sign in</h1>
        <button class="btn ghost block" id="googleBtn" type="button">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1Z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23Z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84Z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06L5.84 9.9C6.71 7.31 9.14 5.38 12 5.38Z"/></svg>
          Continue with Google
        </button>
        <div class="orline">or use email</div>
        <div class="tabs"><button id="tabIn" class="on" type="button">Sign in</button><button id="tabUp" type="button">Create account</button></div>
        <label class="label" for="email">Email</label>
        <input class="input" id="email" type="email" autocomplete="email" placeholder="you@school.edu">
        <label class="label" for="pass">Password</label>
        <input class="input" id="pass" type="password" autocomplete="current-password" placeholder="At least 6 characters">
        <button class="btn primary block" id="tGo" style="margin-top:18px">Sign in</button>
        <div class="err" id="tErr"></div>
      </section>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script type="module">
    import { sb, esc } from "/exam/sb.js";
    const $ = id => document.getElementById(id);
    const show = (which) => { ["s-role","s-student","s-teacher"].forEach(s => $(s).classList.toggle("hidden", s !== which)); };
    const toast = (m) => { const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1800); };

    const origin = location.origin;
    const metaName = (u) => ((u && u.user_metadata && (u.user_metadata.full_name || u.user_metadata.name)) || "").trim();
    const isTeacherAcct = (u) => !!u && !u.is_anonymous && !!u.email;

    // a shared join link (?code=ABC123 or #ABC123) prefills the code + opens the student step
    const urlCode = (new URLSearchParams(location.search).get("code") || location.hash.replace(/^#/, "")).toUpperCase();

    // reflect the current session on the student step: signed-in → Join + prefilled name;
    // signed-out → Continue with Google (+ guest link). Role is decided per action, never
    // by auth type, so a Google-signed-in student is NEVER bounced to the teacher console.
    async function refreshStudentIdentity() {
      const { data:{ user } } = await sb.auth.getUser();
      const signedIn = user && !user.is_anonymous && (user.email || metaName(user));
      if (signedIn) {
        if (!$("sname").value) $("sname").value = metaName(user);
        $("sWho").classList.remove("hidden");
        $("sWho").innerHTML = "Signed in as <b>" + esc(user.email || metaName(user)) + "</b> · <a id='switchAcct'>not you?</a>";
        $("switchAcct").onclick = async () => { await sb.auth.signOut(); location.reload(); };
        $("joinBtn").style.display = ""; $("sGoogle").style.display = "none";
        $("guestOr").style.display = "none"; $("guestJoin").style.display = "none";
      } else {
        $("sWho").classList.add("hidden");
        $("joinBtn").style.display = "none"; $("sGoogle").style.display = "";
        $("guestOr").style.display = ""; $("guestJoin").style.display = "";
      }
    }
    const openStudent = async () => { show("s-student"); await refreshStudentIdentity();
      setTimeout(() => ($("code").value ? $("sname") : $("code")).focus(), 60); };

    // Route on load — remembered role, or a share-link code. No hard redirect for students.
    (async () => {
      const { data:{ user } } = await sb.auth.getUser();
      if (/^[A-Z0-9]{4,6}$/.test(urlCode)) { $("code").value = urlCode; await openStudent(); return; }
      const role = localStorage.getItem("vg_role");
      if (role === "teacher" && isTeacherAcct(user)) { location.replace("/exam/console.html"); return; }
      if (role === "student") { await openStudent(); return; }
      // otherwise: leave the role picker showing
    })();

    $("pickStudent").onclick = () => openStudent();
    $("pickTeacher").onclick = async () => {
      const { data:{ user } } = await sb.auth.getUser();
      if (isTeacherAcct(user)) { localStorage.setItem("vg_role","teacher"); location.replace("/exam/console.html"); return; }
      show("s-teacher");
    };
    document.querySelectorAll("[data-back]").forEach(b => b.onclick = () => show("s-role"));

    // ---- student join ----
    async function resolveExam(code) {
      const rpc = await sb.rpc("find_open_exam", { p_code: code });
      if (!rpc.error && rpc.data && rpc.data[0]) return rpc.data[0];
      const q = await sb.from("exams").select("id,title").eq("code", code).eq("status","open").maybeSingle();
      return (!q.error && q.data) ? q.data : null;
    }
    let joining = false;
    async function doJoin(asGuest) {
      if (joining) return;
      const err = $("sErr"); err.textContent = "";
      const code = $("code").value.trim().toUpperCase(), name = $("sname").value.trim();
      if (code.length < 4) { err.textContent = "Enter the exam code."; return; }
      if (!name) { err.textContent = "Enter your name."; $("sname").focus(); return; }
      joining = true; $("joinBtn").disabled = true;
      try {
        const exam = await resolveExam(code);
        if (!exam) { err.textContent = "No open exam with that code."; joining = false; $("joinBtn").disabled = false; return; }
        let { data:{ user } } = await sb.auth.getUser();
        const signedIn = user && !user.is_anonymous && user.email;
        // teacher can require sign-in per exam (v5). Guests can't reset flags with a fresh identity.
        if (exam.require_signin && !signedIn) {
          err.textContent = "This exam requires signing in with Google.";
          $("sWho").classList.add("hidden"); $("joinBtn").style.display = "none";
          $("sGoogle").style.display = ""; $("guestOr").style.display = "none"; $("guestJoin").style.display = "none";
          joining = false; $("joinBtn").disabled = false; return;
        }
        if (!user) { const r = await sb.auth.signInAnonymously(); if (r.error) throw r.error; user = r.data.user; }
        // idempotent: same (exam, user) updates the same row — no duplicate on re-login
        const { error:e2 } = await sb.from("participants")
          .upsert({ exam_id: exam.id, user_id: user.id, name, status: "ok", last_seen: new Date().toISOString() },
                  { onConflict: "exam_id,user_id" });
        if (e2) throw e2;
        localStorage.setItem("vg_role", "student");
        location.href = "/exam/room.html?e=" + exam.id;
      } catch (ex) { err.textContent = ex.message || "Couldn't join."; joining = false; $("joinBtn").disabled = false; }
    }
    $("joinBtn").onclick = () => doJoin(false);
    $("guestJoin").onclick = () => doJoin(true);
    $("sGoogle").onclick = async () => {
      $("sErr").textContent = "";
      const code = $("code").value.trim().toUpperCase();
      // come back to the same join screen (code preserved) already signed in
      const redirectTo = origin + "/exam/" + (code ? "?code=" + code : "");
      const { error } = await sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo } });
      if (error) $("sErr").textContent =
        /provider is not enabled/i.test(error.message) ? "Google sign-in isn't switched on yet." : error.message;
    };
    $("code").addEventListener("keydown", e => { if (e.key==="Enter") $("sname").focus(); });
    $("sname").addEventListener("keydown", e => { if (e.key==="Enter") { if ($("joinBtn").style.display!=="none") doJoin(false); else $("sGoogle").click(); } });

    // ---- teacher auth ----
    let mode = "in";
    const setMode = (m) => { mode=m; $("tabIn").classList.toggle("on",m==="in"); $("tabUp").classList.toggle("on",m==="up");
      $("tHead").textContent = m==="up" ? "Create a teacher account" : "Teacher sign in";
      $("tGo").textContent = m==="up" ? "Create account" : "Sign in";
      $("pass").autocomplete = m==="up" ? "new-password" : "current-password"; };
    $("tabIn").onclick = () => setMode("in"); $("tabUp").onclick = () => setMode("up");
    $("googleBtn").onclick = async () => {
      $("tErr").textContent = "";
      const { error } = await sb.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: location.origin + "/exam/console.html" },
      });
      if (error) $("tErr").textContent =
        /provider is not enabled/i.test(error.message) ? "Google sign-in isn't switched on yet." : error.message;
    };
    $("tGo").onclick = async () => {
      const btn=$("tGo"), err=$("tErr");
      const email=$("email").value.trim(), password=$("pass").value;
      err.textContent = "";
      if (!email || password.length < 6) { err.textContent = "Enter your email and a 6+ character password."; return; }
      btn.disabled = true;
      try {
        if (mode === "up") {
          const { data, error } = await sb.auth.signUp({ email, password });
          if (error) throw error;
          if (!data.session) { err.style.color="var(--muted)"; err.textContent = "Account created — check your email to confirm, then sign in."; setMode("in"); btn.disabled=false; return; }
        } else {
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
        }
        location.href = "/exam/console.html";
      } catch (ex) { err.style.color=""; err.textContent = ex.message || "Couldn't sign in."; btn.disabled = false; }
    };
    $("pass").addEventListener("keydown", e => { if (e.key==="Enter") $("tGo").click(); });
  </script>
</body>
</html>
