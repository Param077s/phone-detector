<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vigil · Exam report</title>
  <link rel="icon" href="/favicon.svg">
  <meta name="theme-color" content="#eef1f6">
  <link rel="stylesheet" href="/app/exam.css">
  <style>
    .wrap{max-width:820px;margin:0 auto;padding:28px 22px 80px}
    .brand{margin-bottom:22px}
    h1{font-size:23px;margin:0 0 4px;letter-spacing:-.02em}
    .sub{color:var(--muted);margin:0 0 4px;font-size:14px}
    .gen{color:var(--faint);font-size:12px;margin:0 0 22px}
    .load{display:flex;gap:10px;margin:6px 0 22px;flex-wrap:wrap}
    .load .input{flex:1;min-width:180px;text-transform:uppercase;letter-spacing:2px;font-weight:600}
    .err{color:var(--alert);margin:12px 0;min-height:16px}

    .student{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
      padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
    .student h2{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:10px}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
    .chip{font-size:12.5px;padding:5px 11px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
    .chip b{font-weight:700}
    .chip.warn{color:var(--warn);background:var(--warn-soft);border-color:#f0dcb6}
    .chip.alert{color:var(--alert);background:var(--alert-soft);border-color:#f3c9ca}
    .chip.ok{color:var(--ok);background:var(--ok-soft);border-color:#c3e6d5}
    .tl{position:relative;margin-left:5px;padding-left:20px;border-left:2px solid var(--line)}
    /* Aceternity-style timeline beam: a gradient fills the spine as you scroll. */
    .tl::before{content:"";position:absolute;left:-2px;top:0;width:2px;height:calc(var(--fill,0) * 100%);
      background:linear-gradient(180deg,var(--ink),var(--faint));border-radius:2px;
      box-shadow:0 0 8px rgba(12,13,16,.18);transition:height .12s linear;pointer-events:none}
    .ev{position:relative;padding:8px 0;font-size:13.5px;display:flex;gap:12px}
    .ev::before{content:"";position:absolute;left:-27px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--faint);box-shadow:0 0 0 3px #fff}
    .ev.warn::before{background:var(--warn)} .ev.alert::before{background:var(--alert)} .ev.info::before{background:var(--accent)}
    .ev .time{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 78px}
    .ev .what{color:var(--ink)}
    .ev .what small{color:var(--muted)}
    .empty{color:var(--muted);text-align:center;padding:40px 0}

    @media print {
      body{background:#fff;background-image:none}
      .wrap{max-width:none;padding:0}
      .load,.err{display:none !important}
      .student{box-shadow:none;break-inside:avoid;page-break-inside:avoid;margin-bottom:12px}
      .tl::before{display:none}
      *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M6 10V7.5A1.5 1.5 0 0 1 7.5 6H10M14 6h2.5A1.5 1.5 0 0 1 18 7.5V10M18 14v2.5a1.5 1.5 0 0 1-1.5 1.5H14M10 18H7.5A1.5 1.5 0 0 1 6 16.5V14" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="2.6" fill="#fff"/></svg></span>
      <b>Vigil</b><span class="tag">· Exam report</span>
    </div>

    <h1 id="title">Exam report</h1>
    <p class="sub" id="sub">Enter an exam code to see each student's activity timeline.</p>
    <div class="gen hidden" id="gen"></div>

    <div class="load">
      <input class="input" id="code" maxlength="6" placeholder="Exam code" autocomplete="off" spellcheck="false">
      <button class="btn primary" id="loadBtn">Load</button>
      <button class="btn ghost hidden" id="csvBtn">Export CSV</button>
      <button class="btn ghost hidden" id="pdfBtn">Save as PDF</button>
    </div>
    <div class="err" id="err"></div>

    <div id="out"></div>
  </div>

  <script src="/app/report.js"></script>
  <script>
  /* Reading progress + back-to-top for a long report. */
  (function(){
    var reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
    var bar = document.createElement("div"); bar.className = "vig-progress";
    var top = document.createElement("button"); top.className = "vig-totop";
    top.setAttribute("aria-label","Back to top");
    top.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M12 19V6M6 12l6-6 6 6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    document.body.appendChild(bar); document.body.appendChild(top);
    top.addEventListener("click", function(){ scrollTo({ top:0, behavior: reduce ? "auto" : "smooth" }); });
    function upd(){
      var y = window.scrollY || document.documentElement.scrollTop;
      var vh = window.innerHeight || document.documentElement.clientHeight || 800;
      var max = document.documentElement.scrollHeight - vh;
      bar.style.width = (max > 0 ? Math.min(1, Math.max(0, y/max)) * 100 : 0) + "%";
      top.classList.toggle("show", y > vh * 0.6);
    }
    addEventListener("scroll", upd, { passive:true });
    addEventListener("resize", upd, { passive:true });
    upd();
  })();
  </script>
</body>
</html>
