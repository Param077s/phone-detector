<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vigil · Live exam</title>
  <link rel="icon" href="/favicon.svg">
  <meta name="theme-color" content="#eef1f6">
  <link rel="stylesheet" href="/app/exam.css">
  <style>
    .bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;
      padding:14px 22px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line)}
    .bar .brand b{font-size:15px}
    .bar .code{color:var(--muted);font:600 13px ui-monospace,Menlo,monospace;letter-spacing:2px}
    .bar .spacer{flex:1}
    .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
    .live i{width:8px;height:8px;border-radius:50%;background:var(--ink);animation:pulse 1.6s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
    .counts{display:flex;gap:8px}
    .counts .pill b{color:var(--ink)}
    .counts .pill.flagged b{color:var(--warn)} .counts .pill.offline b{color:var(--alert)}
    .rep{color:var(--ink);text-decoration:none;font-size:13.5px;font-weight:600;
      border:1px solid var(--line-strong);padding:8px 14px;border-radius:var(--radius-sm);background:#fff}
    .rep:hover{border-color:var(--faint)}
    .wrap{padding:22px;max-width:1200px;margin:0 auto}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
    .tile{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--faint);
      border-radius:var(--radius-sm);padding:15px;box-shadow:var(--shadow-sm);transition:box-shadow .2s,border-color .2s}
    .tile.ok{border-left-color:var(--ok)}
    .tile.warn{border-left-color:var(--warn);background:linear-gradient(180deg,var(--warn-soft),#fff 60%)}
    .tile.alert{border-left-color:var(--alert);background:linear-gradient(180deg,var(--alert-soft),#fff 60%);box-shadow:0 6px 18px rgba(224,72,77,.12)}
    .tile .top{display:flex;align-items:center;gap:9px;margin-bottom:8px}
    .tile.ok .dot{background:var(--ok)} .tile.warn .dot{background:var(--warn)} .tile.alert .dot{background:var(--alert)}
    .name{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .status{font-size:13px;color:var(--muted)}
    .tile.warn .status{color:var(--warn)} .tile.alert .status{color:var(--alert)}
    .meta{margin-top:10px;display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint)}
    .empty{text-align:center;color:var(--muted);padding:80px 20px}
    .empty .big{font-size:17px;color:var(--ink);margin-bottom:6px;font-weight:600}
    .err{color:var(--alert);padding:40px 20px;text-align:center}

    /* Aceternity-style "glowing effect" — a flagged tile breathes in its status
       colour so the teacher's eye is pulled straight to it. */
    @keyframes glowWarn{0%,100%{box-shadow:var(--shadow-sm)}
      50%{box-shadow:var(--shadow-sm),0 0 22px -4px rgba(198,125,10,.45)}}
    @keyframes glowAlert{0%,100%{box-shadow:var(--shadow-sm),0 0 10px -8px rgba(229,72,77,.5)}
      50%{box-shadow:0 8px 22px -8px rgba(229,72,77,.28),0 0 36px -4px rgba(229,72,77,.65)}}
    .tile.warn{animation:glowWarn 2.6s ease-in-out infinite}
    .tile.alert{animation:glowAlert 1.7s ease-in-out infinite}
    /* the most urgent tiles also get a slowly rotating gradient ring */
    @property --ring{syntax:'<angle>';inherits:false;initial-value:0deg}
    .tile.alert::after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;pointer-events:none;
      background:conic-gradient(from var(--ring),transparent 0deg,rgba(229,72,77,.9) 70deg,transparent 150deg,transparent 360deg);
      -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;animation:ringSpin 3.2s linear infinite}
    @keyframes ringSpin{to{--ring:360deg}}
    @media (prefers-reduced-motion:reduce){.tile.warn,.tile.alert,.tile.alert::after{animation:none}}
  </style>
</head>
<body>
  <div class="bar">
    <span class="brand"><span class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M6 10V7.5A1.5 1.5 0 0 1 7.5 6H10M14 6h2.5A1.5 1.5 0 0 1 18 7.5V10M18 14v2.5a1.5 1.5 0 0 1-1.5 1.5H14M10 18H7.5A1.5 1.5 0 0 1 6 16.5V14" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="2.6" fill="#fff"/></svg></span><b id="title">Live exam</b></span>
    <span class="code" id="code"></span>
    <span class="live"><i></i> Live</span>
    <span id="alerts" class="pill" style="display:none">🔔 Alerts on</span>
    <div class="spacer"></div>
    <div class="counts" id="counts"></div>
    <a class="rep" id="repLink" href="#" target="_blank">Report</a>
  </div>
  <div class="wrap"><div id="out"></div></div>
  <script src="/app/live.js"></script>
  <script>
  /* Back-to-top for a tall student wall (no progress bar — a live feed has no "end"). */
  (function(){
    var reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
    var top = document.createElement("button"); top.className = "vig-totop";
    top.setAttribute("aria-label","Back to top");
    top.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M12 19V6M6 12l6-6 6 6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    document.body.appendChild(top);
    top.addEventListener("click", function(){ scrollTo({ top:0, behavior: reduce ? "auto" : "smooth" }); });
    function upd(){
      var y = window.scrollY || document.documentElement.scrollTop;
      var vh = window.innerHeight || document.documentElement.clientHeight || 800;
      top.classList.toggle("show", y > vh * 0.6);
    }
    addEventListener("scroll", upd, { passive:true });
    addEventListener("resize", upd, { passive:true });
    upd();
  })();
  </script>
</body>
</html>
